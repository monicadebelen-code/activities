:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#18202C; --muted:#5B6574; --rule:#D5DAE1;
  --red:#A8231B; --ir:#5C1422; --blue:#2A56C6; --gold:#9A6A00; --green:#2F6B3A;
  --tint-red:#F8E9E7; --tint-blue:#E8EEFB; --tint-gold:#F6EFDC; --tint-green:#E6F1E8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141B; --surface:#171D27; --ink:#E7EBF1; --muted:#9AA4B2; --rule:#2B3442;
    --red:#F0776C; --ir:#D98A99; --blue:#86A6F5; --gold:#E2B754; --green:#7FC48B;
    --tint-red:#2A1A1C; --tint-blue:#18223A; --tint-gold:#2A2415; --tint-green:#172A1C;
  }
}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#171D27; --ink:#E7EBF1; --muted:#9AA4B2; --rule:#2B3442;
  --red:#F0776C; --ir:#D98A99; --blue:#86A6F5; --gold:#E2B754; --green:#7FC48B;
  --tint-red:#2A1A1C; --tint-blue:#18223A; --tint-gold:#2A2415; --tint-green:#172A1C;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Literata",Georgia,"Times New Roman",serif;font-size:1.0625rem;line-height:1.7}
img,svg{max-width:100%}
a{color:var(--blue)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.sans{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}

header.hero{padding:3.5rem 0 2rem}
.hero h1{font-weight:800;font-size:clamp(2rem,5.5vw,3.1rem);line-height:1.1;margin:.2rem 0 1rem;letter-spacing:-.01em}
.hero .lede{font-size:1.2rem;color:var(--muted);margin:0 0 1.5rem;max-width:38rem}
.source-line{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.95rem;color:var(--muted)}
.spectrum{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:1rem 1rem .5rem;margin:2rem 0 .5rem;overflow-x:auto}
.spectrum svg{display:block;min-width:560px;width:100%;height:auto}
.caption{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.88rem;color:var(--muted);margin:.4rem 0 0}

nav.toc{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
nav.toc ol{list-style:none;display:flex;gap:.4rem;margin:0 auto;padding:.6rem 1.25rem;max-width:46rem;overflow-x:auto}
nav.toc a{display:block;white-space:nowrap;text-decoration:none;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.9rem;padding:.3rem .7rem;border:1px solid var(--rule);border-radius:999px;background:var(--surface)}
nav.toc a:hover{border-color:var(--ink)}

section{padding:2.5rem 0;border-bottom:1px solid var(--rule)}
h2{font-weight:800;font-size:clamp(1.55rem,3.6vw,2.05rem);line-height:1.2;margin:0 0 .4rem}
.lesson-num{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--red);font-weight:700;font-size:1rem;margin:0}
.meta{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted);font-size:.93rem;margin:0 0 1.4rem}
h3{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:1.12rem;margin:2rem 0 .5rem}
p{margin:0 0 1rem}
ul,ol{padding-left:1.3rem}
li{margin-bottom:.45rem}

.eli{background:var(--tint-red);border-left:5px solid var(--red);border-radius:0 12px 12px 0;padding:1rem 1.2rem;margin:1.2rem 0 1.6rem;font-size:1.12rem}
.eli strong{font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.vocab{display:grid;grid-template-columns:minmax(8rem,auto) 1fr;gap:.35rem 1rem;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.2rem;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.98rem;line-height:1.5}
.vocab dt{font-weight:700}
.vocab dd{margin:0}
@media (max-width:520px){.vocab{grid-template-columns:1fr}.vocab dd{margin-bottom:.5rem}}

.check{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.2rem;margin:1.2rem 0}
.check h4{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;margin:0 0 .6rem;font-size:1.02rem}
.claim{display:grid;grid-template-columns:auto 1fr;gap:.6rem 1rem;padding:.8rem 0;border-top:1px dashed var(--rule)}
.claim:first-of-type{border-top:0;padding-top:0}
.claim p{margin:0}
.tag{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.8rem;font-weight:700;padding:.2rem .55rem;border-radius:6px;white-space:nowrap;align-self:start;border:1.5px solid}
.t-solid{color:var(--green);background:var(--tint-green);border-color:var(--green)}
.t-early{color:var(--blue);background:var(--tint-blue);border-color:var(--blue)}
.t-idea{color:var(--gold);background:var(--tint-gold);border-color:var(--gold)}
.t-stretch{color:var(--red);background:var(--tint-red);border-color:var(--red)}
@media (max-width:520px){.claim{grid-template-columns:1fr}}

.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.93rem;margin:.6rem 0 0}
.legend span{display:flex;align-items:center;gap:.4rem}

.activity{border:2px solid var(--ink);border-radius:12px;padding:1rem 1.2rem;margin:1.4rem 0}
.activity h4{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;margin:0 0 .5rem}
.activity p:last-child,.activity ol:last-child{margin-bottom:0}

details{background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin:.5rem 0;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.98rem}
summary{cursor:pointer;padding:.7rem 1rem;font-weight:700;list-style-position:outside;margin-left:.6rem}
details[open] summary{border-bottom:1px solid var(--rule)}
details .ans{padding:.7rem 1rem .8rem;color:var(--ink)}
details .ans p:last-child{margin:0}

.note{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.95rem;background:var(--tint-gold);border-radius:10px;padding:.8rem 1rem;margin:1rem 0}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding:0 0 1rem 3rem}
.steps li::before{content:counter(s);position:absolute;left:0;top:.1rem;width:2rem;height:2rem;border-radius:50%;background:var(--red);color:#fff;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700;display:grid;place-items:center}

.refs{padding-left:1.6rem}
.refs li{margin-bottom:1.1rem;line-height:1.55}
.status{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.9rem;color:var(--muted);display:block;margin-top:.2rem}

<script>
const D = {"lessons": [{"id": "l1", "num": 1, "title": "Understanding light: waves, energy, and what happens when light hits something", "intro": "<p class=\"lesson-num\">Lesson 1<\/p><h2>Understanding light: waves, energy, and what happens when light hits something<\/h2><p class=\"meta\">About two hours, in as many sittings as you like. Connects to video chapters 00:00 to 04:24.<\/p><div class=\"eli\"><strong>Explain it like I'm 10:<\/strong> Light is energy that travels in waves. Some waves are long and lazy, some are short and bouncy. The short ones carry more punch per packet. When light hits something, it can bounce off, go through, get knocked around, or get swallowed up. Whether it gets swallowed depends on whether the light's energy is the right \"size\" for that material, like a key fitting a lock.<\/div><p class=\"lesson-goals\"><strong>By the end of this lesson you should be able to:<\/strong> describe light as both a wave and a stream of photons; explain wavelength, frequency, and amplitude; place visible light on the electromagnetic spectrum; explain why shorter wavelengths carry more energy; describe the four things that happen when light meets matter; explain how and why materials absorb some wavelengths but not others; and use these ideas to explain why red and near-infrared light behave differently in the human body.<\/p>", "screens": [{"title": "Part 1: What is light?", "part": "", "html": "<h3 class=\"part\">Part 1: What is light?<\/h3><p>Light is a form of energy that moves from one place to another. Scientists call it <strong>electromagnetic radiation<\/strong>. That sounds scary, but \"radiation\" just means energy spreading out from a source. A campfire, a phone screen, and the Sun all give off electromagnetic radiation.<\/p><p>Light is made of two linked parts, an electric field and a magnetic field, that wiggle together as they travel. Unlike sound or ocean waves, light doesn't need anything to travel through. It can cross the empty space between the Sun and Earth. In empty space it moves at about 300,000 kilometers per second. That's fast enough to circle Earth about seven times in one second. Sunlight takes roughly eight minutes to reach us.<\/p><p><strong>Light has two personalities.<\/strong> Sometimes it's easiest to picture light as a <em>wave<\/em>, spreading out like ripples on a pond. Other times it's easiest to picture it as a stream of tiny packets of energy called <em>photons<\/em>. Both pictures are correct. Scientists use whichever one explains the situation better. The wave picture helps explain color and how light bends. The photon picture helps explain absorption, which is the main question in this lesson.<\/p>", "widget": null}, {"title": "Part 2: The parts of a wave", "part": "", "html": "<h3 class=\"part\">Part 2: The parts of a wave<\/h3><figure class=\"fig\">\n<svg aria-label=\"Two waves. The red wave has long, widely spaced crests. The blue wave has short, closely spaced crests. Wavelength is the distance from one crest to the next. Amplitude is the height of a crest above the middle line.\" role=\"img\" viewbox=\"0 0 680 230\">\n<g fill=\"none\" stroke-linecap=\"round\">\n<line stroke=\"currentColor\" stroke-dasharray=\"4 4\" stroke-opacity=\".2\" x1=\"20\" x2=\"660\" y1=\"70\" y2=\"70\"><\/line>\n<path d=\"M20,70 q40,-60 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0\" stroke=\"var(--red)\" stroke-width=\"3\"><\/path>\n<line stroke=\"currentColor\" stroke-dasharray=\"4 4\" stroke-opacity=\".2\" x1=\"20\" x2=\"660\" y1=\"180\" y2=\"180\"><\/line>\n<path d=\"M20,180 q20,-60 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0\" stroke=\"var(--blue)\" stroke-width=\"3\"><\/path>\n<path d=\"M60,22 L220,22\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n<path d=\"M60,16 v12 M220,16 v12\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n<path d=\"M393,70 L393,41\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n<path d=\"M388,70 h10 M388,41 h10\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n<path d=\"M40,132 L120,132\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n<path d=\"M40,126 v12 M120,126 v12\" stroke=\"currentColor\" stroke-width=\"1.5\"><\/path>\n<\/g>\n<g fill=\"currentColor\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<text x=\"230\" y=\"26\">one wavelength (long)<\/text>\n<text x=\"402\" y=\"60\">amplitude (height)<\/text>\n<text x=\"130\" y=\"136\">one wavelength (short)<\/text>\n<text fill=\"var(--red)\" font-weight=\"700\" text-anchor=\"end\" x=\"675\" y=\"124\">longer wave, less energy<\/text>\n<text fill=\"var(--blue)\" font-weight=\"700\" text-anchor=\"end\" x=\"675\" y=\"222\">shorter wave, more energy<\/text>\n<\/g>\n<\/svg>\n<figcaption class=\"caption\">A simplified drawing. Real light waves are far too small to see: a red wavelength is about 1/100 the width of a human hair.<\/figcaption>\n<\/figure><dl class=\"vocab\">\n<dt>Crest and trough<\/dt><dd>The top and bottom of each wiggle.<\/dd>\n<dt>Wavelength<\/dt><dd>The distance from one crest to the next. For visible light it's measured in nanometers (nm). One nanometer is one billionth of a meter.<\/dd>\n<dt>Frequency<\/dt><dd>How many crests pass a point every second, measured in hertz (Hz). Red light has about 450 million billion crests passing per second.<\/dd>\n<dt>Amplitude<\/dt><dd>The height of the wave. For light, bigger amplitude means brighter light, which you can also think of as more photons arriving.<\/dd>\n<\/dl><p><strong>Wavelength and frequency are a seesaw.<\/strong> All light travels at the same speed, so if the waves are longer, fewer of them can pass by each second. Long wavelength means low frequency. Short wavelength means high frequency. Scientists write this as <em>speed = wavelength \u00d7 frequency<\/em>.<\/p><p class=\"try\"><strong>Picture it:<\/strong> Tie a rope to a door handle and shake the other end. Shake slowly and you get long, lazy waves. Shake quickly and the waves get short and packed together. Your arm is working harder to make the short waves. That's a good hint for Part 4.<\/p><p><strong>Color is wavelength.<\/strong> Your eyes and brain turn different wavelengths into different colors. Roughly, violet is about 400 nm, blue 450, green 530, yellow 580, orange 610, and red 650 to 750. White light, like sunlight, is a mix of many wavelengths. A prism or a raindrop spreads that mix out into a rainbow because each wavelength bends by a slightly different amount.<\/p>", "widget": null}, {"title": "Part 3: The electromagnetic spectrum", "part": "", "html": "<h3 class=\"part\">Part 3: The electromagnetic spectrum<\/h3><p>Visible light is only a thin slice of a much bigger family called the <strong>electromagnetic spectrum<\/strong>. Every member is the same kind of wave, travelling at the same speed. The only difference is wavelength, and that one difference changes how each type behaves.<\/p><div class=\"tablewrap\">\n<table>\n<thead><tr><th>Type<\/th><th>Wavelength<\/th><th>Everyday examples<\/th><th>What it mostly does to matter<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Radio waves<\/td><td>About 30 cm to many km<\/td><td>Radio and TV broadcasts<\/td><td>Pass through most things with little effect<\/td><\/tr>\n<tr><td>Microwaves<\/td><td>About 1 mm to 30 cm<\/td><td>Microwave ovens, Wi-Fi, phone signals<\/td><td>Make water molecules spin, which heats food<\/td><\/tr>\n<tr><td>Infrared<\/td><td>About 750 nm to 1 mm<\/td><td>Heat lamps, TV remotes, warmth from the Sun<\/td><td>Makes molecules vibrate, which we feel as warmth<\/td><\/tr>\n<tr class=\"hl\"><td>Visible light<\/td><td>About 380 to 750 nm<\/td><td>Rainbows, everything you see<\/td><td>Moves electrons in pigments, allowing vision and photosynthesis<\/td><\/tr>\n<tr><td>Ultraviolet (UV)<\/td><td>About 10 to 380 nm<\/td><td>Sunburn, black lights<\/td><td>Can break some chemical bonds and damage DNA; also helps skin make vitamin D<\/td><\/tr>\n<tr><td>X-rays<\/td><td>About 0.01 to 10 nm<\/td><td>Medical and dental X-rays<\/td><td>Pass through soft tissue but are stopped more by bone; can damage cells<\/td><\/tr>\n<tr><td>Gamma rays<\/td><td>Less than 0.01 nm<\/td><td>Radioactive materials, cancer radiotherapy<\/td><td>Very high energy; can seriously damage cells<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div><p><strong>Two kinds of infrared.<\/strong> Infrared is a huge range, so scientists split it up. <em>Near-infrared<\/em> (about 750 to 2,500 nm) sits right next to red and behaves a lot like visible light; it's the kind the video focuses on. <em>Far infrared<\/em> has much longer wavelengths and is what warm objects, including your own body, give off as heat. A thermal camera \"sees\" far infrared.<\/p>", "widget": null}, {"title": "Part 4: Photons: why short waves pack more punch", "part": "", "html": "<h3 class=\"part\">Part 4: Photons: why short waves pack more punch<\/h3><p>Now switch to the photon picture. Each photon carries a fixed amount of energy, and that amount depends only on its wavelength. <strong>The shorter the wavelength, the more energy each photon carries.<\/strong> A blue photon carries more energy than a red one. A UV photon carries even more, which is why UV can damage skin cells while red light can't.<\/p><p>Scientists often measure the energy of one photon in <strong>electron volts (eV)<\/strong>, a unit made for tiny amounts of energy. There's a handy shortcut:<\/p><p class=\"formula\">photon energy (eV) \u2248 1240 \u00f7 wavelength (nm)<\/p><div class=\"tablewrap\">\n<table>\n<thead><tr><th>Light<\/th><th>Wavelength<\/th><th>Energy per photon<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>UV-B (causes sunburn)<\/td><td>300 nm<\/td><td>1240 \u00f7 300 \u2248 4.1 eV<\/td><\/tr>\n<tr><td>Blue<\/td><td>450 nm<\/td><td>1240 \u00f7 450 \u2248 2.8 eV<\/td><\/tr>\n<tr><td>Red (used in the Lesson 4 study)<\/td><td>670 nm<\/td><td>1240 \u00f7 670 \u2248 1.9 eV<\/td><\/tr>\n<tr><td>Near-infrared<\/td><td>900 nm<\/td><td>1240 \u00f7 900 \u2248 1.4 eV<\/td><\/tr>\n<tr><td>Near-infrared<\/td><td>1,650 nm<\/td><td>1240 \u00f7 1650 \u2248 0.75 eV<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div><p><strong>Brightness is not the same as energy per photon.<\/strong> This is one of the most important ideas in the whole lesson. A brighter light sends <em>more<\/em> photons, but each photon still has the same energy as before. A very bright red lamp is just a lot of small red packets. It doesn't turn into UV.<\/p><p class=\"try\"><strong>Picture it:<\/strong> Think of photons as coins and a molecule as a vending machine that only takes one exact coin. Pour in a thousand of the wrong coin, and nothing comes out. One coin of the right size, and it works. Whether light gets absorbed depends mostly on having the right \"coin\" (wavelength), not on how many coins you have.<\/p>", "widget": "wavelength"}, {"title": "Part 5: When light meets matter: four possible outcomes", "part": "", "html": "<h3 class=\"part\">Part 5: When light meets matter: four possible outcomes<\/h3><p>Every time light hits something, whether it's a window, a leaf, or your skin, each photon does one of four things:<\/p><dl class=\"vocab\">\n<dt>Reflection<\/dt><dd>The light bounces off. A mirror reflects almost all visible light. A white shirt reflects most colors, which is why it looks white.<\/dd>\n<dt>Transmission<\/dt><dd>The light passes straight through. Clear glass transmits visible light, which is why you can see through it.<\/dd>\n<dt>Scattering<\/dt><dd>The light gets knocked in a new direction by tiny particles or structures, like a pinball. It keeps going, just not in a straight line. Fog, milk, and skin scatter light a lot.<\/dd>\n<dt>Absorption<\/dt><dd>The light is swallowed. The photon disappears, and its energy is handed to the material.<\/dd>\n<\/dl><p>Most real materials do a mix of all four, and the mix depends on wavelength. A material can be transparent to one color and completely block another.<\/p><p><strong>Why things have color.<\/strong> A green leaf looks green because its chlorophyll absorbs most of the red and blue light and reflects the green. A ripe tomato absorbs blue and green and reflects red. The color you see is the light that <em>wasn't<\/em> absorbed. Black objects absorb nearly all visible light, which is why a black shirt gets hotter in the sun than a white one.<\/p><p><strong>Why the sky is blue.<\/strong> Tiny air molecules scatter short blue wavelengths much more than long red ones. So blue light gets bounced all over the sky and reaches your eyes from every direction. At sunset, sunlight travels through much more air, most of the blue is scattered away, and the reds and oranges are what's left.<\/p>", "widget": null}, {"title": "Part 6: How absorption actually works", "part": "", "html": "<h3 class=\"part\">Part 6: How absorption actually works<\/h3><p>Absorption happens when a photon's energy matches something the material can \"do\" with exactly that amount of energy. What the material does depends on the photon's energy:<\/p><figure class=\"fig\">\n<svg aria-label=\"Energy levels drawn as stairs. An electron sits on the lowest step. A photon whose energy exactly matches the gap to the next step is absorbed and the electron jumps up. A photon whose energy doesn't match any gap passes by without being absorbed.\" role=\"img\" viewbox=\"0 0 680 250\">\n<g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"3\">\n<line x1=\"250\" x2=\"430\" y1=\"210\" y2=\"210\"><\/line>\n<line x1=\"250\" x2=\"430\" y1=\"130\" y2=\"130\"><\/line>\n<line x1=\"250\" x2=\"430\" y1=\"70\" y2=\"70\"><\/line>\n<\/g>\n<g fill=\"currentColor\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<text x=\"440\" y=\"214\">starting level<\/text>\n<text x=\"440\" y=\"134\">higher level<\/text>\n<text x=\"440\" y=\"74\">even higher level<\/text>\n<\/g>\n<circle cx=\"300\" cy=\"210\" fill=\"var(--gold)\" r=\"9\"><\/circle>\n<circle cx=\"380\" cy=\"130\" fill=\"var(--gold)\" r=\"9\"><\/circle>\n<path d=\"M300,198 C320,170 360,160 378,142\" fill=\"none\" stroke=\"var(--gold)\" stroke-dasharray=\"4 4\" stroke-width=\"2\"><\/path>\n<path d=\"M40,190 q10,-12 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"3\"><\/path>\n<path d=\"M216,184 l12,6 l-12,6\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"3\"><\/path>\n<text fill=\"var(--green)\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\" font-weight=\"700\" x=\"40\" y=\"170\">right energy: absorbed<\/text>\n<path d=\"M40,40 q14,-12 28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0 t28,0\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"3\"><\/path>\n<path d=\"M654,34 l12,6 l-12,6\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"3\"><\/path>\n<text fill=\"var(--red)\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\" font-weight=\"700\" x=\"40\" y=\"22\">wrong energy: passes by<\/text>\n<\/svg>\n<figcaption class=\"caption\">A simplified model. Electrons can only sit on certain energy \"steps.\" A photon is absorbed when its energy matches the size of a step.<\/figcaption>\n<\/figure><p><strong>1. High and medium energy (UV and visible): electrons jump.<\/strong> Electrons in atoms and molecules can only have certain amounts of energy, like standing on steps of a staircase, never between steps. If a photon's energy exactly matches the gap to a higher step, the electron absorbs it and jumps up. If it doesn't match any gap, the photon isn't absorbed there. This is why pigments absorb certain colors. In big, complicated molecules, the steps are blurry, so a molecule absorbs a <em>range<\/em> of wavelengths, called an absorption band, instead of one exact color.<\/p><p><strong>2. Lower energy (infrared): molecules vibrate.<\/strong> Infrared photons usually don't have enough energy to lift electrons. Instead, they make the bonds between atoms stretch, bend, and wiggle, like springs. Molecules can only vibrate in certain ways, so again only certain wavelengths match. Water is especially good at absorbing some infrared wavelengths because its bonds vibrate at just the right rates.<\/p><p class=\"try\"><strong>Picture it:<\/strong> Pushing a friend on a swing works best if you push at the swing's natural rhythm. Push at a random rhythm and not much happens. Molecules are similar: light gets absorbed when its \"rhythm\" (frequency) matches a natural rhythm of the molecule. Scientists call this <strong>resonance<\/strong>.<\/p><p><strong>What happens to the absorbed energy?<\/strong> Energy can't vanish, so it has to go somewhere. Usually one of three things happens:<\/p><ul>\n<li><strong>It becomes heat.<\/strong> The energy spreads out into jiggling molecules. This is the most common outcome, and it's why sunlit surfaces warm up.<\/li>\n<li><strong>It drives chemistry.<\/strong> The energy causes a chemical change. Chlorophyll uses it for photosynthesis. Molecules in your eye use it to trigger vision. UV-B helps skin make vitamin D, and too much UV damages DNA.<\/li>\n<li><strong>It's given off again as a different color.<\/strong> Some materials absorb one wavelength and glow at a longer one. This is called <strong>fluorescence<\/strong>. Highlighter ink does it, and so do white LED bulbs (Part 8).<\/li>\n<\/ul>", "widget": null}, {"title": "Part 7: How light fades as it travels through something", "part": "", "html": "<h3 class=\"part\">Part 7: How light fades as it travels through something<\/h3><p>When light goes into a material that absorbs and scatters, it doesn't stop all at once. Each thin layer takes away a <em>fraction<\/em> of what's left. If the first millimeter removes half the light, the next millimeter removes half of what remains, and so on: 100%, 50%, 25%, 12.5%, 6.25%. The light fades quickly, but a small amount can still get surprisingly far. How fast it fades depends on the wavelength and the material.<\/p><p>Scattering makes this more complicated. In milky or fleshy materials, photons zigzag instead of going straight. That makes their path longer, which gives more chances to be absorbed, but it also spreads the light out sideways so the material seems to glow.<\/p><p class=\"try\"><strong>Picture it:<\/strong> Imagine walking through a crowded market. You get bumped (scattered) all the time, which makes your path long and zigzagging. Every stall is a chance someone stops you (absorption). Someone who's hard to stop can wander deep into the crowd even while getting bumped around.<\/p>", "widget": null}, {"title": "Part 8: Where light comes from, and how we measure it", "part": "", "html": "<h3 class=\"part\">Part 8: Where light comes from, and how we measure it<\/h3><p><strong>Hot things glow.<\/strong> Anything warm gives off electromagnetic radiation just because its atoms are jiggling. This is <strong>thermal radiation<\/strong>. The hotter something is, the more it gives off and the shorter its peak wavelength. A stove coil glows dull red. A candle flame or an old incandescent bulb filament glows yellow-orange, but most of its output is actually invisible near-infrared; about 90% of an incandescent bulb's energy comes out as infrared and heat, not visible light. The Sun's surface is much hotter (about 5,500\u00b0C), so its output peaks in visible light while still including lots of infrared and some UV. This smooth, wide spread of wavelengths is called a <strong>broad spectrum<\/strong>.<\/p><p><strong>LEDs work differently.<\/strong> An LED doesn't make light by getting hot. Electrons inside a special material drop down an energy step and give off photons of one narrow color. Most white LED bulbs actually use a <em>blue<\/em> LED coated with a yellow fluorescent material. Some blue light passes through, some is turned into yellow and green, and your eyes blend them into \"white.\" Because nothing in this process is hot enough to glow in infrared, LEDs give off very little light past red. That's exactly why they're so efficient, and it's the point the video is concerned about.<\/p><p><strong>Three ways to measure light:<\/strong><\/p><dl class=\"vocab\">\n<dt>Lux<\/dt><dd>Brightness <em>as the human eye sees it<\/em>. A lux meter is designed to copy human vision, so it ignores infrared and UV completely. A room can be very bright in lux while containing almost no near-infrared.<\/dd>\n<dt>Irradiance<\/dt><dd>The total power of light landing on a surface, measured in watts per square meter. This counts invisible light too.<\/dd>\n<dt>Spectrum<\/dt><dd>A graph showing how much light there is at each wavelength. It's like a nutrition label for light, and it's the best way to compare light sources.<\/dd>\n<\/dl>", "widget": null}, {"title": "Part 9: How can we understand light better?", "part": "", "html": "<h3 class=\"part\">Part 9: How can we understand light better?<\/h3><p>Light is invisible in motion, too tiny to see, and too fast to watch. So scientists rely on models and tools that make it visible:<\/p><ul>\n<li><strong>Models and analogies.<\/strong> Ropes and slinkies show wavelength and frequency. Staircases show energy levels. Swings show resonance. Coins and vending machines show why the right wavelength matters more than brightness. Every model is useful but imperfect, so it helps to know where each one breaks down.<\/li>\n<li><strong>Spectroscopes.<\/strong> These split light into its wavelengths so you can see what a source is made of. A prism, or even the shiny side of an old CD or DVD, works as a simple one.<\/li>\n<li><strong>Sensors that see beyond our eyes.<\/strong> Many phone cameras can detect near-infrared, which is why a TV remote's invisible signal shows up as a flashing light on screen. Thermal cameras detect far infrared.<\/li>\n<li><strong>Spectrum graphs.<\/strong> Learning to read a graph of light intensity against wavelength lets you compare sunlight, LEDs, and incandescent bulbs at a glance, like the chart at the top of this course.<\/li>\n<li><strong>Simulations.<\/strong> Free interactive simulations from PhET (University of Colorado Boulder), such as <em>Wave on a String<\/em>, <em>Molecules and Light<\/em>, and <em>Blackbody Spectrum<\/em>, let you change wavelength, energy, and temperature and watch what happens.<\/li>\n<li><strong>Measuring and questioning.<\/strong> Scientists test ideas by measuring. When someone makes a claim about light, ask: what wavelength, how much, measured how, and compared to what?<\/li>\n<\/ul>", "widget": null}, {"title": "Part 10: What this means for our course", "part": "", "html": "<h3 class=\"part\">Part 10: What this means for our course<\/h3><p>Now we can connect all of this to the video's main idea. Your body is a material, just like a leaf or a glass of milk, and it absorbs, scatters, and transmits light depending on wavelength. Three molecules do most of the absorbing in skin and tissue:<\/p><dl class=\"vocab\">\n<dt>Melanin<\/dt><dd>The pigment that colors skin. It absorbs strongly in UV and blue, and less and less toward red. This helps protect skin from UV.<\/dd>\n<dt>Hemoglobin<\/dt><dd>The oxygen-carrying molecule in blood. It absorbs blue and green strongly, but absorbs much less red. That's why blood looks red.<\/dd>\n<dt>Water<\/dt><dd>Your body is mostly water. Water barely absorbs visible and shorter near-infrared light, but absorbs longer infrared strongly.<\/dd>\n<\/dl><figure class=\"fig\">\n<svg aria-label=\"Simplified absorption curves from 400 to 1600 nanometers. Melanin absorbs most at short wavelengths and less toward red. Hemoglobin absorbs strongly in blue and green, then drops after about 600 nanometers. Water absorbs little until about 900 nanometers, then rises with a big peak near 1450. Between about 650 and 1300 nanometers all three absorb relatively little: the optical window.\" role=\"img\" viewbox=\"0 0 700 280\">\n<rect fill=\"var(--tint-green)\" height=\"205\" width=\"347\" x=\"173\" y=\"25\"><\/rect>\n<text fill=\"var(--green)\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"14\" font-weight=\"700\" x=\"290\" y=\"45\">the \"optical window\"<\/text>\n<line stroke=\"currentColor\" stroke-opacity=\".4\" x1=\"40\" x2=\"680\" y1=\"230\" y2=\"230\"><\/line>\n<g fill=\"currentColor\" fill-opacity=\".7\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"12\">\n<text x=\"30\" y=\"250\">400<\/text><text x=\"160\" y=\"250\">650<\/text><text x=\"296\" y=\"250\">900<\/text><text x=\"508\" y=\"250\">1300<\/text><text x=\"660\" y=\"250\">1600 nm<\/text>\n<text x=\"40\" y=\"18\">more absorption<\/text>\n<text x=\"240\" y=\"272\">wavelength<\/text>\n<\/g>\n<path d=\"M40,40 C120,90 200,140 320,180 C440,205 560,218 680,224\" fill=\"none\" stroke=\"#8A5A2B\" stroke-width=\"3\"><\/path>\n<path d=\"M40,120 L50,35 L62,150 C80,175 100,120 112,112 C124,106 132,130 150,196 C190,216 260,222 680,226\" fill=\"none\" stroke=\"var(--red)\" stroke-dasharray=\"8 5\" stroke-width=\"3\"><\/path>\n<path d=\"M40,229 C200,229 300,226 400,220 C440,212 460,192 480,197 C520,205 560,120 600,70 C620,92 650,112 680,100\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"3\"><\/path>\n<g font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\" font-weight=\"700\">\n<text fill=\"#8A5A2B\" x=\"72\" y=\"70\">melanin<\/text>\n<text fill=\"var(--red)\" x=\"70\" y=\"170\">hemoglobin<\/text>\n<text fill=\"var(--blue)\" x=\"610\" y=\"60\">water<\/text>\n<\/g>\n<\/svg>\n<figcaption class=\"caption\">Simplified shapes, not real measurements. Between roughly 650 and 1,300 nm, the body's main absorbers all absorb relatively little, so light can travel further.<\/figcaption>\n<\/figure><p><strong>The optical window.<\/strong> Look at where all three curves are low at the same time: roughly 650 to 1,300 nm, the red and near-infrared range. Scientists call this the <strong>optical window<\/strong> of tissue. Light in this window is absorbed less, so it travels further before fading. This is the real reason your finger glows red over a flashlight: blue and green are absorbed by hemoglobin and melanin near the surface, while red slips through the window. It's also why hospital pulse oximeters clip onto your finger and shine red and infrared light through it.<\/p><p><strong>Putting it together:<\/strong><\/p><ul>\n<li><strong>Absorption needs a match.<\/strong> Red and near-infrared light can only affect cells if some molecule absorbs those wavelengths. Lesson 3 looks at which molecules in mitochondria scientists think might do this.<\/li>\n<li><strong>Light fades with depth.<\/strong> Red and near-infrared light travel further than blue, but they still weaken layer by layer. Most is absorbed or scattered within the first few millimeters to centimeters, and only a small fraction goes much deeper. Keep this in mind when the video says light \"sails through\" to your organs.<\/li>\n<li><strong>Different sources, different spectra.<\/strong> Sunlight and incandescent bulbs have a broad spectrum with lots of near-infrared. White LEDs have a blue peak and almost nothing beyond red. Energy-saving window coatings can also reflect much of the infrared in sunlight.<\/li>\n<li><strong>Our eyes and lux meters can't tell the difference.<\/strong> Two rooms can look equally bright while one has plenty of near-infrared and the other has none. That's why the difference went unnoticed.<\/li>\n<li><strong>Energy per photon matters.<\/strong> Using our shortcut, 0.75 eV works out to near-infrared light at about 1,650 nm. That's the number the video discusses in Lesson 3.<\/li>\n<\/ul><p><strong>\"Ultra-processed light.\"<\/strong> The video borrows an idea from food. Ultra-processed food has had its fiber and nutrients removed. In the same way, the video says LED light has had the long wavelengths \"removed,\" leaving mostly blue and green. With what you now know, you can see what the phrase means in physics terms: a narrow spectrum instead of a broad one. It's still a comparison (a metaphor), not a scientific measurement.<\/p>", "widget": null}, {"title": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "part": "", "html": "<h3 class=\"part\">Part 11: The evidence file: how deep does red and near-infrared light really go?<\/h3><p>The video says red and near-infrared light \"sail through\" your body to your muscles, bones, and organs. Part 10 explained why these wavelengths travel further than others. But how far, and how much of the light arrives? Scientists have measured this directly. In this part you'll look at their results and decide for yourself.<\/p>", "widget": null}, {"title": "How scientists measure light inside the body", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<h4 class=\"sub\">How scientists measure light inside the body<\/h4><p>Researchers use a few approaches. They shine light on one side of a living person and place a sensitive detector, called a radiometer or spectrometer, on the other side, blocking all stray light. They test <strong>cadavers<\/strong> (bodies donated to science), where detectors can be placed inside the skull or brain. And they use <strong>photon counters<\/strong>, detectors so sensitive they can register single photons. Each method has trade-offs: cadaver tissue has no blood flowing and may be chemically preserved, while living measurements can only be made from outside the body.<\/p>", "widget": null}, {"title": "The studies", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<h4 class=\"sub\">The studies<\/h4><div class=\"tablewrap\">\n<table>\n<thead><tr><th>Study<\/th><th>What they did<\/th><th>What they found<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Jeffery et al., 2025<\/td><td>Seven men stood with their bare backs to midday sunlight, with a detector against their chests.<\/td><td>Light was detected through the chest in every subject, mostly between 600 and 1,000 nm, peaking around 800 to 870 nm. At 850 nm, about 17 mW/cm\u00b2 went in and about 5.6 \u00b5W/cm\u00b2 came out.<\/td><\/tr>\n<tr><td>Jeffery et al., 2025<\/td><td>Compared red (670 nm) and near-infrared (850 nm) light, and imaged a hand with an infrared camera.<\/td><td>The authors report 670 nm light did not pass through the body. In the hand, 850 nm passed easily; veins absorbed it, but bone looked fairly transparent. Six layers of clothing were about 100 times more transparent to 850 nm than to visible light.<\/td><\/tr>\n<tr><td>Jagdeo et al., 2012<\/td><td>Shone 830 nm and 633 nm LED light through cadaver heads with skin and skull intact, and through a living hand.<\/td><td>830 nm passed through at 0.9% (temple), 2.1% (forehead), and 11.7% (back of head). Red light at 633 nm barely got through. Through 25 mm of living hand, only 0.01% to 0.09% of 830 nm light passed.<\/td><\/tr>\n<tr><td>Tedford et al., 2015<\/td><td>Shone an 808 nm laser into eight unpreserved cadaver heads and measured light at different depths in the brain.<\/td><td>Light reached about 40 mm deep through scalp, skull, and brain. 808 nm scattered and was absorbed less in brain tissue than 660 or 940 nm.<\/td><\/tr>\n<tr><td>Henderson &amp; Morries, 2015<\/td><td>Tested more powerful near-infrared lasers (up to 10 W) through living hands and a sheep's head.<\/td><td>About 99% of 808 nm light was lost by 3 cm. A 10 W, 810 nm source pushed 0.6% through 25 mm of living hand, at least six times more than earlier low-power tests.<\/td><\/tr>\n<tr><td>Radford et al., 2025<\/td><td>Fired pulsed near-infrared laser light into one side of a volunteer's head and counted single photons on the opposite side.<\/td><td>Photons crossed the entire adult head, even at its widest point. Only about one photon in a billion billion (10<sup>18<\/sup>) made it, and collecting enough took 30 minutes.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>", "widget": null}, {"title": "What the numbers show: fading with depth", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<h4 class=\"sub\">What the numbers show: fading with depth<\/h4><figure class=\"fig\">\n<svg aria-label=\"Bar chart of how much 808 nanometer light remains at each depth in cadaver head tissue. 100 percent at the surface, about 11 percent at 1 centimeter, about 1.2 percent at 2 centimeters, about 0.13 percent at 3 centimeters, and about 0.01 percent at 4 centimeters.\" role=\"img\" viewbox=\"0 0 680 290\">\n<line stroke=\"currentColor\" stroke-opacity=\".4\" x1=\"60\" x2=\"660\" y1=\"240\" y2=\"240\"><\/line>\n<line stroke=\"currentColor\" stroke-opacity=\".4\" x1=\"60\" x2=\"60\" y1=\"40\" y2=\"240\"><\/line>\n<g fill=\"var(--red)\">\n<rect height=\"200\" rx=\"3\" width=\"70\" x=\"95\" y=\"40\"><\/rect>\n<rect height=\"22\" rx=\"3\" width=\"70\" x=\"210\" y=\"218\"><\/rect>\n<rect height=\"2.4\" rx=\"1\" width=\"70\" x=\"325\" y=\"237.6\"><\/rect>\n<rect height=\"0.6\" width=\"70\" x=\"440\" y=\"239.4\"><\/rect>\n<rect height=\"0.2\" width=\"70\" x=\"555\" y=\"239.8\"><\/rect>\n<\/g>\n<g fill=\"currentColor\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">\n<text x=\"130\" y=\"32\">100%<\/text>\n<text x=\"245\" y=\"210\">about 11%<\/text>\n<text x=\"360\" y=\"228\">about 1.2%<\/text>\n<text x=\"475\" y=\"228\">about 0.13%<\/text>\n<text x=\"590\" y=\"228\">about 0.01%<\/text>\n<\/g>\n<g fill=\"currentColor\" fill-opacity=\".75\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\" text-anchor=\"middle\">\n<text x=\"130\" y=\"260\">surface<\/text><text x=\"245\" y=\"260\">1 cm<\/text><text x=\"360\" y=\"260\">2 cm<\/text><text x=\"475\" y=\"260\">3 cm<\/text><text x=\"590\" y=\"260\">4 cm<\/text>\n<text x=\"360\" y=\"284\">depth into scalp, skull, and brain<\/text>\n<\/g>\n<\/svg>\n<figcaption class=\"caption\">Light remaining at each depth, calculated from the fading rate Tedford et al. measured for 808 nm light in cadaver heads. Real tissue varies, and scattering can make light slightly brighter than this just below the skin, but the overall pattern holds: roughly a tenfold drop for every centimeter.<\/figcaption>\n<\/figure><p>Put the studies side by side and a consistent picture appears:<\/p><ul>\n<li><strong>Near-infrared really does reach deep.<\/strong> It has been measured through the chest, the hand, the skull, and even an entire head. So the idea that it penetrates deep into the body is supported.<\/li>\n<li><strong>Near-infrared goes further than red.<\/strong> In several studies, red light around 633 to 670 nm got through far less than near-infrared around 800 to 850 nm.<\/li>\n<li><strong>But the amount shrinks fast.<\/strong> Every study agrees that most of the light is absorbed or scattered in the first few centimeters. At 850 nm, only about 1 part in 3,000 of the sunlight hitting someone's back was measured coming out of their chest.<\/li>\n<\/ul><p class=\"try\"><strong>Where did the rest of the light go?<\/strong> Remember Part 6: absorbed energy doesn't vanish. The light that didn't come out the other side was absorbed <em>inside<\/em> the body along the way, mostly in the outer layers, turning into heat or possibly driving chemistry. So \"only a tiny fraction passes through\" and \"light energy is delivered to tissue\" are both true at the same time.<\/p>", "widget": "depth"}, {"title": "The real debate: is a small fraction enough?", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<h4 class=\"sub\">The real debate: is a small fraction enough?<\/h4><p>Scientists who study red and near-infrared light don't generally argue that large amounts reach deep organs. Their case rests on two different ideas:<\/p><div class=\"check\">\n<div class=\"claim\"><span class=\"tag t-early\">Argument 1<\/span><p><strong>Tiny amounts may be enough.<\/strong> Jagdeo's team suggested that even very low light levels reaching the brain might change how brain cells and mitochondria behave, and noted that their measurements were in a similar range to doses used in animal stroke studies. Some research suggests cells respond to small doses of light, and that more isn't always better.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-early\">Argument 2<\/span><p><strong>Light may not need to go deep at all.<\/strong> In Jeffery's 2025 study, a group of people had their heads wrapped in aluminium foil while 850 nm light shone on their backs. One of their colour-vision scores still improved by 7% the next day. The authors suggest light absorbed in one part of the body may send signals through the blood to other parts, so the light only needs to act as a trigger. Similar \"remote effects\" have been reported in animal studies.<\/p><\/div>\n<\/div><p><strong>Reasons for caution.<\/strong> We don't yet know how much light cells deep inside the body actually need, or whether it's the same for every tissue. The remote-effect idea is promising but its mechanism is unclear. The foil-wrapped group in the 2025 study had only five people, all men, while the comparison group that got no light was seven women, so the groups differed in more than one way. Bigger, better-matched studies are needed.<\/p>", "widget": null}, {"title": "Activity: evidence debate", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<div class=\"activity\">\n<h4>Activity: evidence debate<\/h4>\n<ol>\n<li><strong>Do the math.<\/strong> In the sunlight study, 17 mW/cm\u00b2 went in and 5.6 \u00b5W/cm\u00b2 came out (1 mW = 1,000 \u00b5W). Convert both numbers to \u00b5W/cm\u00b2, then divide to find \"1 part in how many.\" Using the bar chart, estimate how many times weaker the light is at 2 cm than at the surface.<\/li>\n<li><strong>Sort the evidence.<\/strong> On your own, take this claim from the video: <em>\"Near-infrared light from sunlight passes through your body to reach your muscles, bones, and organs.\"<\/em> Sort each study row into three piles: supports the claim, challenges the claim, or it depends on what you mean.<\/li>\n<li><strong>Split the claim.<\/strong> Rewrite it as two separate claims: one about <em>whether<\/em> light reaches deep tissue, and one about <em>how much<\/em>. Give each a label from our scale: Solid, Early evidence, Idea stage, or Stretched.<\/li>\n<li><strong>Argue both sides.<\/strong> Write one paragraph arguing \"a small fraction is enough to matter\" and one arguing \"a small fraction is too little to matter.\" Each must use at least two studies from the table. Finish by writing which side convinces you more, and what experiment would settle the question.<\/li>\n<\/ol>\n<\/div>", "widget": null}, {"title": "Check your understanding: the evidence file", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<h4 class=\"sub\">Check your understanding: the evidence file<\/h4><details><summary>Which studies show that near-infrared light can travel all the way through a body part?<\/summary><div class=\"ans\"><p>Jeffery et al. (through the chest and hand), Jagdeo et al. (through the skull and a living hand), Henderson &amp; Morries (through a living hand), and Radford et al. (through an entire adult head).<\/p><\/div><\/details><details><summary>What did several studies find when comparing red light (about 633 to 670 nm) with near-infrared (about 800 to 850 nm)?<\/summary><div class=\"ans\"><p>Near-infrared passed through tissue far better. Red light barely got through the skull in Jagdeo's study, and Jeffery's team reported 670 nm did not pass through the body at all.<\/p><\/div><\/details><details><summary>If only 1 part in 3,000 of sunlight's 850 nm light comes out of the chest, where did the rest go?<\/summary><div class=\"ans\"><p>It was absorbed or scattered inside the body along the way, mostly in the outer few centimeters. Absorbed energy becomes heat or may drive chemical changes; it doesn't simply disappear.<\/p><\/div><\/details><details><summary>Explain the two arguments researchers give for why a small fraction of light might still matter.<\/summary><div class=\"ans\"><p>First, cells may respond to very small doses of light. Second, light absorbed near the surface may trigger signals, possibly carried in the blood, that affect distant tissues, so light might not need to reach deep organs directly.<\/p><\/div><\/details><details><summary>Give one weakness in the foil-wrapped head experiment.<\/summary><div class=\"ans\"><p>Any of these: only five people were in the foil group; they were all men while the no-light comparison group was all women; the mechanism for the effect isn't known; it hasn't been repeated in larger studies.<\/p><\/div><\/details><details><summary>Rewrite the video's \"sails through\" claim so it matches the evidence.<\/summary><div class=\"ans\"><p>For example: \"Near-infrared light can travel deeper into the body than other visible light and has even been detected through the chest and head, but most of it is absorbed in the first few centimeters, and only a very small fraction reaches deep organs.\"<\/p><\/div><\/details>", "widget": null}, {"title": "Scientist check", "part": "Part 11: The evidence file: how deep does red and near-infrared light really go?", "html": "<div class=\"check\">\n<h4>Scientist check<\/h4>\n<div class=\"claim\"><span class=\"tag t-solid\">Solid<\/span><p>LEDs give off very little light beyond red. The researchers behind the red-light study describe white LEDs as peaking around 450 nm with little output beyond about 620 nm.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-solid\">Solid<\/span><p>Red and near-infrared light travel deeper into the body than blue light, because of the optical window. The flashlight trick shows this.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>Near-infrared \"sails through\" your body to muscles, bones, and organs. Experiments have detected it through the chest and even the whole head, so it does reach deep. But it fades roughly tenfold per centimeter, and only a very small fraction arrives deep inside (see Part 11).<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-idea\">Idea stage<\/span><p>\"We lost 95% of the spectrum.\" This is a spoken estimate from researcher Glen Jeffery. The exact number depends on how far into the infrared you count, so treat it as a dramatic way of saying \"a lot,\" not a precise measurement.<\/p><\/div>\n<\/div>", "widget": null}, {"title": "At-home labs", "part": "", "html": "<h3 class=\"part\">At-home labs<\/h3><p class=\"note\"><strong>Safety first:<\/strong> never look directly at the Sun, even through a CD or filter. Don't stare into bright LEDs or flashlights. Incandescent and halogen bulbs get hot enough to burn, so only an adult should handle them.<\/p><div class=\"activity\"><h4>At-home lab 1: make waves<\/h4><ol>\n<li>Tie one end of a rope, skipping rope, or long scarf to a chair leg or door handle, and hold the other end.<\/li>\n<li>Shake slowly for 10 seconds and count the crests (a phone video played back slowly makes counting easier). Then shake quickly for 10 seconds and count again.<\/li>\n<li>Record: What happened to the wavelength when the frequency went up? Which one tired your arm more, and what does that suggest about energy?<\/li><\/ol><\/div>", "widget": null}, {"title": "At-home lab 2: CD spectroscope", "part": "At-home labs", "html": "<div class=\"activity\">\n<h4>At-home lab 2: CD spectroscope<\/h4>\n<ol>\n<li>Hold an old CD or DVD shiny side up, and tilt it so light from a source reflects off it into your eyes at an angle. You'll see rainbow bands.<\/li>\n<li>Compare three sources: a white LED bulb or phone flashlight, a warm incandescent or halogen lamp (switched on by an adult), and a white wall lit by daylight.<\/li>\n<li>Sketch the rainbow from each. Which source has the strongest red end? Which has the brightest blue? Which looks most even from end to end?<\/li>\n<\/ol>\n<\/div>", "widget": null}, {"title": "At-home lab 3: see the invisible", "part": "At-home labs", "html": "<div class=\"activity\">\n<h4>At-home lab 3: see the invisible<\/h4>\n<ol>\n<li>Point a TV remote at a phone camera (the front-facing camera often works best) and press a button while watching the screen.<\/li>\n<li>Record what you see on screen and what you see with your eyes.<\/li>\n<li>Explain: What kind of light does the remote use? Why can the camera detect it when you can't?<\/li>\n<\/ol>\n<\/div>", "widget": null}, {"title": "At-home lab 4: light through skin and milk", "part": "At-home labs", "html": "<div class=\"activity\">\n<h4>At-home lab 4: light through skin and milk<\/h4>\n<ol>\n<li>Press a fingertip gently over a phone flashlight for a few seconds and note the color. The light can get warm, so don't hold it long.<\/li>\n<li>Fill a clear glass with water. Shine the flashlight through it from the side. Then stir in a few drops of milk and look again from the side and from the far end.<\/li>\n<li>Explain using the words <em>scattering<\/em>, <em>absorption<\/em>, and <em>optical window<\/em>: Why does your finger glow red? Why does the milky water look bluish from the side and orange-ish from the far end?<\/li>\n<\/ol>\n<\/div>", "widget": null}, {"title": "Check your understanding", "part": "", "html": "<h3>Check your understanding<\/h3><details><summary>If one light wave has a longer wavelength than another, what can you say about its frequency and the energy of its photons?<\/summary><div class=\"ans\"><p>It has a lower frequency, and each of its photons carries less energy.<\/p><\/div><\/details><details><summary>A very bright red lamp and a dim UV lamp shine on your skin. Which one can damage DNA, and why?<\/summary><div class=\"ans\"><p>The UV lamp. Each UV photon has enough energy to break certain chemical bonds. Brightness only changes how many photons arrive, not how much energy each one has, so even lots of red photons can't do what one UV photon does.<\/p><\/div><\/details><details><summary>Name the four things that can happen when light hits matter, with one example of each.<\/summary><div class=\"ans\"><p>Reflection (mirror), transmission (clear glass), scattering (fog or milk), absorption (black shirt getting warm).<\/p><\/div><\/details><details><summary>Why does a leaf look green?<\/summary><div class=\"ans\"><p>Chlorophyll absorbs most red and blue light and reflects green light, so green is what reaches your eyes.<\/p><\/div><\/details><details><summary>Explain in your own words why a molecule absorbs some wavelengths but not others.<\/summary><div class=\"ans\"><p>A photon is only absorbed if its energy matches something the molecule can do, like lifting an electron to a higher energy level or making its bonds vibrate at a natural rhythm. If the energy doesn't match, the photon passes by.<\/p><\/div><\/details><details><summary>What are three things that can happen to the energy after light is absorbed?<\/summary><div class=\"ans\"><p>It can turn into heat, drive a chemical reaction (like photosynthesis or vision), or be given off again as light of a longer wavelength (fluorescence).<\/p><\/div><\/details><details><summary>What is the optical window, and why does it explain the red glow in your finger?<\/summary><div class=\"ans\"><p>It's the range of roughly 650 to 1,300 nm where melanin, hemoglobin, and water all absorb relatively little. Blue and green light are absorbed near the surface, but red light falls in the window, so it can travel through your finger.<\/p><\/div><\/details><details><summary>Why can't a lux meter tell you whether a room has near-infrared light?<\/summary><div class=\"ans\"><p>Lux measures brightness as the human eye sees it, so it ignores wavelengths our eyes can't detect, including near-infrared.<\/p><\/div><\/details><details><summary>Use the shortcut to find the energy of a 620 nm orange-red photon.<\/summary><div class=\"ans\"><p>1240 \u00f7 620 = 2.0 eV.<\/p><\/div><\/details><details><summary>Why do white LEDs give off so little near-infrared compared with incandescent bulbs?<\/summary><div class=\"ans\"><p>Incandescent bulbs make light by heating a filament, and hot objects give off lots of infrared. White LEDs make light from a blue LED plus a fluorescent coating, with nothing hot enough to glow in the infrared.<\/p><\/div><\/details>", "widget": null}], "cards": [["Crest and trough", "The top and bottom of each wiggle."], ["Wavelength", "The distance from one crest to the next. For visible light it's measured in nanometers (nm). One nanometer is one billionth of a meter."], ["Frequency", "How many crests pass a point every second, measured in hertz (Hz). Red light has about 450 million billion crests passing per second."], ["Amplitude", "The height of the wave. For light, bigger amplitude means brighter light, which you can also think of as more photons arriving."], ["Reflection", "The light bounces off. A mirror reflects almost all visible light. A white shirt reflects most colors, which is why it looks white."], ["Transmission", "The light passes straight through. Clear glass transmits visible light, which is why you can see through it."], ["Scattering", "The light gets knocked in a new direction by tiny particles or structures, like a pinball. It keeps going, just not in a straight line. Fog, milk, and skin scatter light a lot."], ["Absorption", "The light is swallowed. The photon disappears, and its energy is handed to the material."], ["Lux", "Brightness as the human eye sees it . A lux meter is designed to copy human vision, so it ignores infrared and UV completely. A room can be very bright in lux while containing almost no near-infrared."], ["Irradiance", "The total power of light landing on a surface, measured in watts per square meter. This counts invisible light too."], ["Spectrum", "A graph showing how much light there is at each wavelength. It's like a nutrition label for light, and it's the best way to compare light sources."], ["Melanin", "The pigment that colors skin. It absorbs strongly in UV and blue, and less and less toward red. This helps protect skin from UV."], ["Hemoglobin", "The oxygen-carrying molecule in blood. It absorbs blue and green strongly, but absorbs much less red. That's why blood looks red."], ["Water", "Your body is mostly water. Water barely absorbs visible and shorter near-infrared light, but absorbs longer infrared strongly."]], "quiz": [{"t": "mc", "q": "What unit is used in this course to measure the wavelength of light?", "o": ["Meters per second", "Nanometers", "Lux", "Electron grams"], "a": 1, "e": "Wavelength is a distance, and light waves are tiny, so we use nanometers (billionths of a meter). Lux measures brightness, not wavelength."}, {"t": "mc", "q": "Which of these has the shortest wavelength?", "o": ["Red light", "Orange light", "Blue light", "Near-infrared light"], "a": 2, "e": "Blue light is around 450 nm. Orange and red are longer, and near-infrared is longer still (past 750 nm)."}, {"t": "mc", "q": "When you press your finger over a phone flashlight, why does it glow red?", "o": ["Blood turns all light red", "The flashlight only gives off red light", "Red wavelengths pass through while blue and green are absorbed", "Your skin makes its own red light"], "a": 2, "e": "The flashlight gives off white light, but blue and green are absorbed near the surface. Longer red wavelengths travel through the tissue."}, {"t": "mc", "q": "Energy-efficient window coatings are mainly designed to block which kind of light?", "o": ["Radio waves", "Visible green light", "Infrared light", "X-rays"], "a": 2, "e": "The coatings act as heat shields. Infrared carries heat, so blocking it helps buildings save energy."}, {"t": "mc", "q": "\"Ultra-processed light\" is best described as:", "o": ["A brightness measurement", "A metaphor comparing LED light to processed food", "A brand of LED bulb", "A medical diagnosis"], "a": 1, "e": "It's a comparison. Just as processed food loses nutrients, the phrase suggests LED light has 'lost' long wavelengths."}, {"t": "mc", "q": "Near-infrared light covers roughly which range of wavelengths?", "o": ["750 to 2500 nm", "100 to 300 nm", "380 to 450 nm", "500 to 600 nm"], "a": 0, "e": "Near-infrared starts just past visible red (about 750 nm) and goes to about 2500 nm, as described in the video."}, {"t": "tf", "q": "Humans can see near-infrared light.", "o": ["True", "False"], "a": 1, "e": "Near-infrared is invisible to our eyes. We can sometimes feel it as warmth."}, {"t": "tf", "q": "Incandescent bulbs glow because a thin wire inside gets very hot.", "o": ["True", "False"], "a": 0, "e": "That heat is also why they give off so much infrared."}, {"t": "tf", "q": "LED bulbs give off lots of light beyond 700 nm.", "o": ["True", "False"], "a": 1, "e": "LEDs peak around 450 nm (blue) and give off very little past red."}, {"t": "tf", "q": "The claim that we \"lost 95% of the spectrum\" is a precise laboratory measurement.", "o": ["True", "False"], "a": 1, "e": "It's a spoken estimate. The number changes depending on how far into the infrared you count."}, {"t": "tf", "q": "Long wavelengths of light travel deeper into the body than short wavelengths.", "o": ["True", "False"], "a": 0, "e": "Short wavelengths are absorbed near the skin's surface; red and near-infrared go deeper."}, {"t": "sa", "q": "Why was the switch from incandescent bulbs to LEDs seen as good for the environment?", "s": "LEDs use much less electricity, which lowers energy use and carbon emissions.", "e": "Full credit for mentioning lower electricity use or lower emissions."}, {"t": "sa", "q": "Describe the red glow test and what it shows about light.", "s": "Covering a flashlight with a finger makes it glow red. It shows that red light passes through tissue while blue and green light are absorbed.", "e": "Look for both parts: what you see, and the idea that different wavelengths behave differently in the body."}, {"t": "sa", "q": "Name two light sources that are rich in near-infrared light.", "s": "Sunlight and incandescent bulbs (also accept fire or halogen bulbs).", "e": "Any two of: sunlight, incandescent bulbs, halogen bulbs, fire."}, {"t": "sa", "q": "Why should we treat the \"95%\" figure with some caution?", "s": "It's a spoken estimate, not a measured result, and the percentage depends on how much of the infrared range you include.", "e": "Full credit for noting it's an estimate or that the number depends on how you count."}]}, {"id": "l2", "num": 2, "title": "Mitochondria: the power plants in your cells", "intro": "<p class=\"lesson-num\">Lesson 2<\/p><h2>Mitochondria: the power plants in your cells<\/h2><p class=\"meta\">Video chapters 04:24 to 07:21<\/p><div class=\"eli\"><strong>Explain it like I'm 10:<\/strong> Every cell in your body has tiny power plants called mitochondria. They take food and the air you breathe and turn them into little energy coins called ATP. Your body spends ATP coins for everything: your heart beating, your brain thinking, your muscles moving.<\/div>", "screens": [{"title": "The big ideas", "part": "", "html": "<h3>The big ideas<\/h3><p><strong>ATP is energy money.<\/strong> ATP stands for adenosine triphosphate. Cells \"spend\" it whenever they do work. Parts of the body that work hardest, like the heart, brain, and the retina in your eye, are packed with mitochondria.<\/p><p><strong>The electron transport chain is a bucket brigade.<\/strong> Imagine a line of people passing buckets of water. Inside the mitochondria, a line of four big proteins passes along electrons that came from your food. As the electrons are passed, the proteins pump tiny particles called protons to one side of a wall (a membrane). This builds up pressure, a bit like water behind a dam.<\/p><p><strong>ATP synthase is a water wheel.<\/strong> The protons rush back through a spinning machine called ATP synthase, like water turning a mill wheel. Each spin helps build ATP. The video says it can spin up to about 9,000 times per minute.<\/p><dl class=\"vocab\">\n<dt>Mitochondria<\/dt><dd>Tiny parts inside cells that make most of the cell's usable energy. One is a mitochondrion.<\/dd>\n<dt>ATP<\/dt><dd>The molecule cells use as their energy currency.<\/dd>\n<dt>Electron transport chain<\/dt><dd>A line of proteins that passes electrons along to build up energy for making ATP.<\/dd>\n<dt>ATP synthase<\/dt><dd>A spinning protein machine that makes ATP.<\/dd>\n<\/dl>", "widget": null}, {"title": "Scientist check", "part": "The big ideas", "html": "<div class=\"check\">\n<h4>Scientist check<\/h4>\n<div class=\"claim\"><span class=\"tag t-solid\">Solid<\/span><p>Mitochondria make ATP using the electron transport chain and ATP synthase. This is standard biology you'll find in any textbook.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>\"Textbook ideas are crumbling; humans are solar powered.\" Humans still get their chemical energy from food. The newer idea (Lesson 3) is that light might help the machinery run faster, which is different from light replacing food.<\/p><\/div>\n<\/div>", "widget": null}, {"title": "Activity: build a tabletop power plant", "part": "The big ideas", "html": "<div class=\"activity\"><h4>Activity: build a tabletop power plant<\/h4><ol>\n<li>Line up four cups or small bowls in a row. They are the four protein complexes of the electron transport chain. Put a pile of paper scraps or coins at the end: that's ATP synthase's supply.<\/li>\n<li>Use a marble, bead, or bottle cap as an electron. Move it from cup to cup. Each time it reaches the last cup, move one coin to a \"made ATP\" pile.<\/li>\n<li>Do it for 30 seconds at normal speed and count your ATP. Then do it again, but pause for 3 seconds at every cup.<\/li>\n<li>Write: What does the pause represent in a real cell? What would happen to a heart or brain cell if its chain slowed down?<\/li><\/ol><\/div>", "widget": null}, {"title": "Check your understanding", "part": "", "html": "<h3>Check your understanding<\/h3><details><summary>What two things do mitochondria need to make ATP?<\/summary><div class=\"ans\"><p>Broken-down food (fuel, like glucose) and oxygen.<\/p><\/div><\/details><details><summary>In the water wheel comparison, what plays the role of the water?<\/summary><div class=\"ans\"><p>Protons flowing back through ATP synthase.<\/p><\/div><\/details><details><summary>Why do the heart and brain have so many mitochondria?<\/summary><div class=\"ans\"><p>They use huge amounts of energy all the time, so they need lots of ATP.<\/p><\/div><\/details>", "widget": null}], "cards": [["Mitochondria", "Tiny parts inside cells that make most of the cell's usable energy. One is a mitochondrion."], ["ATP", "The molecule cells use as their energy currency."], ["Electron transport chain", "A line of proteins that passes electrons along to build up energy for making ATP."], ["ATP synthase", "A spinning protein machine that makes ATP."]], "quiz": [{"t": "mc", "q": "What is the main job of mitochondria?", "o": ["Store copies of DNA", "Make ATP", "Digest food in the stomach", "Carry oxygen in the blood"], "a": 1, "e": "Mitochondria turn broken-down food and oxygen into ATP. Red blood cells carry oxygen; the stomach digests food."}, {"t": "mc", "q": "ATP is best described as:", "o": ["A hormone that controls sugar", "A type of light", "The cell's energy currency", "A protein that pumps blood"], "a": 2, "e": "Cells 'spend' ATP to do work, like money. Insulin is the hormone that controls sugar."}, {"t": "mc", "q": "According to the course, how many large protein complexes pass electrons along the electron transport chain before ATP synthase?", "o": ["Two", "Four", "Seven", "Twelve"], "a": 1, "e": "Four protein complexes pass electrons along. ATP synthase (sometimes called complex V) comes at the end."}, {"t": "mc", "q": "What gets pumped across the mitochondrial membrane to build up \"pressure\"?", "o": ["Glucose", "Photons", "Vitamin C", "Protons"], "a": 3, "e": "Protons are pumped to one side, like water behind a dam, then flow back through ATP synthase."}, {"t": "mc", "q": "ATP synthase is best compared to a:", "o": ["Water wheel", "Light bulb", "Storage box", "Traffic light"], "a": 0, "e": "Protons rushing through ATP synthase make it spin, like water turning a mill wheel."}, {"t": "mc", "q": "Which body parts are especially packed with mitochondria?", "o": ["Hair and nails", "Fat tissue only", "The outer layer of skin", "The heart, brain, and retina"], "a": 3, "e": "These tissues use huge amounts of energy all the time, so they need lots of ATP."}, {"t": "tf", "q": "Mitochondria need oxygen to make ATP efficiently.", "o": ["True", "False"], "a": 0, "e": "Oxygen from breathing is combined with fuel from food to make ATP."}, {"t": "tf", "q": "Humans get their chemical energy mainly from light rather than food.", "o": ["True", "False"], "a": 1, "e": "Food is still our fuel. The newer idea is that light may help the machinery run better, not replace food."}, {"t": "tf", "q": "The electrons passed along the electron transport chain originally come from food.", "o": ["True", "False"], "a": 0, "e": "Electrons are stripped from the broken-down products of food."}, {"t": "tf", "q": "The video says ATP synthase can spin up to about 9,000 revolutions per minute.", "o": ["True", "False"], "a": 0, "e": "That's the figure given in the video (about 150 spins per second)."}, {"t": "tf", "q": "Mitochondria are found only in muscle cells.", "o": ["True", "False"], "a": 1, "e": "Almost every cell in the body has mitochondria, often hundreds or thousands of them."}, {"t": "sa", "q": "Explain the bucket brigade comparison for the electron transport chain.", "s": "Like people passing buckets down a line, proteins pass electrons from one to the next, and this passing is used to pump protons.", "e": "Look for the idea of passing electrons along a line of proteins."}, {"t": "sa", "q": "Give three examples of things your body spends ATP on.", "s": "Heartbeats, brain cells firing, muscles moving (also accept immune defence or liver cleaning toxins).", "e": "Any three reasonable examples of body work."}, {"t": "sa", "q": "What would happen to ATP production if the electron transport chain slowed down?", "s": "Fewer protons would be pumped, so less ATP would be made and cells would have less energy.", "e": "Full credit for 'less ATP'; bonus for explaining why."}, {"t": "sa", "q": "Explain the difference between \"light replaces food\" and \"light helps the machinery run.\"", "s": "The first says light is our fuel; the second says food is still the fuel but light may make the energy-making reactions go faster or smoother.", "e": "Look for the distinction between fuel and a helper or nudge."}]}, {"id": "l3", "num": 3, "title": "How light might talk to your cells", "intro": "<p class=\"lesson-num\">Lesson 3<\/p><h2>How light might talk to your cells<\/h2><p class=\"meta\">Video chapters 07:21 to 13:53<\/p><div class=\"eli\"><strong>Explain it like I'm 10:<\/strong> Some scientists think red and infrared light act like a gentle push on a playground swing. The swing (your cell's energy machine) still runs on food, but the little push helps it go a bit faster and smoother. Other scientists are still checking whether this push is really strong enough to matter.<\/div>", "screens": [{"title": "The big ideas", "part": "", "html": "<h3>The big ideas<\/h3><p><strong>A discovery from the Soviet Union.<\/strong> In the 1980s, biophysicist Tiina Karu in Moscow (the video spells her name \"Tina\") studied low-power red and near-infrared lasers. She found that this light could speed up activity in cells and linked the effect to mitochondria. Today this area is called <em>photobiomodulation<\/em>, which just means \"using light to change how cells behave.\"<\/p><p><strong>Light bounces around inside you.<\/strong> Once near-infrared light enters your body, it scatters, bouncing off cell parts again and again, like a pinball. The video says this makes your body a kind of \"photon trap,\" where light hangs around until something absorbs it.<\/p><p><strong>The 0.75 electron volt idea.<\/strong> Scientists can describe light by its wavelength or by its energy per photon, measured in electron volts (eV). A 2026 paper by Bob Fosbury, Glen Jeffery, and colleagues points out that sunlight, measured this way, has a big peak near 0.75 eV. They note that this is similar to the energy \"hill\" electrons have to get over when they hop between proteins in the electron transport chain. They suggest sunlight may help electrons over that hill. They call this <em>photometabolism<\/em>.<\/p><p><strong>Slippery water.<\/strong> The video also describes a newer idea: near-infrared light warms a thin, sticky layer of water around ATP synthase, making it less sticky so the wheel spins more easily.<\/p><p><strong>\"21st century scurvy.\"<\/strong> Long ago, sailors got scurvy from a lack of vitamin C, even though they had enough calories. The video borrows this to argue that people indoors may have a \"light deficiency\" even with a good diet. It also says blue-heavy LED light may slow mitochondria down, like pressing the brake while the accelerator (red light) has been taken away.<\/p><dl class=\"vocab\">\n<dt>Photon<\/dt><dd>A single tiny packet of light.<\/dd>\n<dt>Electron volt (eV)<\/dt><dd>A unit for very small amounts of energy, like the energy of one photon.<\/dd>\n<dt>Photobiomodulation<\/dt><dd>Using light, usually red or near-infrared, to change how cells work.<\/dd>\n<dt>Hypothesis<\/dt><dd>A testable idea that hasn't been proven yet.<\/dd>\n<dt>Preprint<\/dt><dd>A scientific paper shared publicly before other experts have reviewed it.<\/dd>\n<\/dl>", "widget": null}, {"title": "Scientist check", "part": "The big ideas", "html": "<div class=\"check\">\n<h4>Scientist check<\/h4>\n<div class=\"claim\"><span class=\"tag t-early\">Early evidence<\/span><p>Red and near-infrared light can affect mitochondria in lab studies. Photobiomodulation is a real research field, though results vary with the dose and the situation.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-idea\">Idea stage<\/span><p>The 0.75 eV \"coincidence\" and photometabolism. The Fosbury paper was posted in August 2026 as a preprint, so other scientists haven't formally reviewed it yet. Also notice that the paper describes infrared photons as nudging the chances that electrons get over the hill, not as supplying the chemical energy itself.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>\"Sunlight gives us two to three times more energy than food\" and \"light is a nutrient.\" These are bold framings. The paper itself says light shifts the speed of reactions rather than acting as fuel, which is a much smaller claim.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-idea\">Idea stage<\/span><p>Slippery water around ATP synthase, \"ATP drops 20 to 30% without red light,\" and blue light as a brake. The video gives no specific study for these numbers, and lab results with pure blue light don't automatically apply to normal living rooms.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>\"Western medicine ignored Karu because she published in Russian journals.\" Her work is widely cited today, and she published in international journals too. The story is simpler in the video than in real history.<\/p><\/div>\n<\/div>", "widget": null}, {"title": "Activity: metaphor or measurement?", "part": "The big ideas", "html": "<div class=\"activity\">\n<h4>Activity: metaphor or measurement?<\/h4>\n<p>Make a two-column chart. Sort these phrases from the video: \"ultra-processed light,\" \"0.75 electron volts,\" \"optical vitamin,\" \"670 nanometers,\" \"21st century scurvy,\" \"photon trap,\" \"15 minutes.\" Then write a short paragraph: why do science communicators use metaphors, and when can they mislead people?<\/p>\n<\/div>", "widget": null}, {"title": "Check your understanding", "part": "", "html": "<h3>Check your understanding<\/h3><details><summary>What's the difference between a preprint and a peer-reviewed paper?<\/summary><div class=\"ans\"><p>A preprint is shared before other experts check it. A peer-reviewed paper has been examined by independent scientists before publication. Peer review doesn't make something certainly true, but it's an important quality check.<\/p><\/div><\/details><details><summary>In your own words, what is photometabolism?<\/summary><div class=\"ans\"><p>The idea that sunlight, especially infrared, helps the chemical reactions in our mitochondria run more easily, without being food itself.<\/p><\/div><\/details><details><summary>Why did the video mention scurvy?<\/summary><div class=\"ans\"><p>To compare a vitamin C shortage to a possible \"light shortage\": you can eat enough and still be missing something your body needs.<\/p><\/div><\/details>", "widget": null}], "cards": [["Photon", "A single tiny packet of light."], ["Electron volt (eV)", "A unit for very small amounts of energy, like the energy of one photon."], ["Photobiomodulation", "Using light, usually red or near-infrared, to change how cells work."], ["Hypothesis", "A testable idea that hasn't been proven yet."], ["Preprint", "A scientific paper shared publicly before other experts have reviewed it."]], "quiz": [{"t": "mc", "q": "What does photobiomodulation mean?", "o": ["Using light to change how cells behave", "The study of photographs", "Making vitamins from sunlight", "Correcting eyesight with glasses"], "a": 0, "e": "'Photo' means light and 'modulation' means changing, so it's using light to change how cells work."}, {"t": "mc", "q": "Which scientist studied red and near-infrared lasers in Moscow in the 1980s?", "o": ["Glen Jeffery", "Bob Fosbury", "Tiina Karu", "Richard Weller"], "a": 2, "e": "Tiina Karu linked the effects of red and near-infrared light to mitochondria. The video spells her name 'Tina'."}, {"t": "mc", "q": "When measured in electron volts, sunlight has a big peak near:", "o": ["0.075 eV", "0.75 eV", "7.5 eV", "75 eV"], "a": 1, "e": "The Fosbury paper highlights a broad maximum near 0.75 eV."}, {"t": "mc", "q": "Why do Fosbury and colleagues find the 0.75 eV figure interesting?", "o": ["It equals the energy needed to melt ice", "It matches the energy in a sugar molecule", "It's similar to the energy barrier electrons cross between electron transport chain proteins", "It's the brightness of an LED"], "a": 2, "e": "They suggest sunlight photons may help electrons get over that energy 'hill.'"}, {"t": "mc", "q": "A preprint is a scientific paper that:", "o": ["Has been reviewed by independent experts", "Is shared publicly before peer review", "Is printed in a textbook", "Has been withdrawn for errors"], "a": 1, "e": "Preprints let research be shared quickly, but they haven't yet passed formal expert review."}, {"t": "mc", "q": "What does it mean that near-infrared light travels in a \"scattering-dominated\" way inside the body?", "o": ["It's absorbed instantly at the skin", "It reflects completely off the body", "It travels in a perfectly straight line", "It bounces many times off cell parts"], "a": 3, "e": "The light bounces around like a pinball, forming a spread-out cloud of light inside tissue."}, {"t": "tf", "q": "The Fosbury paper says infrared photons supply chemical energy to cells, just like food.", "o": ["True", "False"], "a": 1, "e": "The paper says the photons shift the odds of reactions happening, rather than supplying chemical energy."}, {"t": "tf", "q": "\"21st century scurvy\" is an official medical diagnosi
