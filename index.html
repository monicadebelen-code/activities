s.", "o": ["True", "False"], "a": 1, "e": "It's a comparison used to explain an idea, not a recognised disease."}, {"t": "tf", "q": "Scurvy is caused by a lack of vitamin C.", "o": ["True", "False"], "a": 0, "e": "Sailors on long voyages got scurvy because their food lacked vitamin C."}, {"t": "tf", "q": "The video claims blue light may slow mitochondria while red light speeds them up.", "o": ["True", "False"], "a": 0, "e": "That's the video's 'accelerator and brake' claim, based on lab studies. It's still at the idea stage for everyday life."}, {"t": "tf", "q": "The idea that infrared light makes the water around ATP synthase less sticky is a well-established fact.", "o": ["True", "False"], "a": 1, "e": "It's a newer hypothesis, rated Idea stage in the course."}, {"t": "sa", "q": "In your own words, what is photometabolism?", "s": "The idea that sunlight, especially infrared, helps the chemical reactions in mitochondria run more easily, without being food.", "e": "Look for light helping metabolism, not replacing food."}, {"t": "sa", "q": "Why does the video compare a lack of red and infrared light to scurvy?", "s": "Because sailors ate enough calories but still got sick from missing one nutrient, and the video argues people indoors may be missing something they need even with a good diet.", "e": "Full credit for the idea of a hidden deficiency despite enough food."}, {"t": "sa", "q": "Why might lab results using pure blue light not apply to a normal living room?", "s": "Lab tests often use strong, isolated light on cells, while homes have mixed, weaker light and whole living bodies.", "e": "Accept any reasonable difference in dose, setting, or subjects."}, {"t": "sa", "q": "Why should we be cautious about the claim that sunlight gives us two to three times more energy than food?", "s": "No study is cited for it, and the related paper says light nudges reaction speeds rather than acting as fuel.", "e": "Full credit for either missing source or the mismatch with the paper."}]}, {"id": "l4", "num": 4, "title": "Light and blood sugar", "intro": "<p class=\"lesson-num\">Lesson 4<\/p><h2>Light and blood sugar<\/h2><p class=\"meta\">Video chapters 13:53 to 18:11<\/p><div class=\"eli\"><strong>Explain it like I'm 10:<\/strong> Sugar from food goes into your blood. Your cells grab it and burn it for energy. If cells burn it slowly, sugar piles up in the blood like cars in a traffic jam. Two studies suggest that light might help clear the traffic a bit faster.<\/div>", "screens": [{"title": "The big ideas", "part": "", "html": "<h3>The big ideas<\/h3><p><strong>Glucose and insulin.<\/strong> Glucose is the main sugar in your blood. Insulin is a hormone from the pancreas that works like a key, helping glucose get into cells. In type 2 diabetes, cells stop responding well to insulin, so blood sugar stays too high.<\/p><p><strong>The video's logic:<\/strong> if mitochondria slow down, cells need less glucose, sugar builds up in the blood, the pancreas makes more insulin, and over time this could contribute to insulin resistance.<\/p>", "widget": null}, {"title": "Study 1: red light and a sugar drink (2024)", "part": "", "html": "<h3>Study 1: red light and a sugar drink (2024)<\/h3><p>Researchers Michael Powner and Glen Jeffery in London tested 30 healthy adults. Everyone did a glucose tolerance test, where you drink a sugary drink and have your blood sugar checked over two hours. Then half the group got 15 minutes of 670 nm red light on their upper back before a second test. The other half sat the same way with the light off (a placebo). In the red light group, the total rise in blood sugar over two hours was 27.7% lower, and the highest spike was 7.5% lower. (The video says \"over 5%,\" but the paper reports 7.5%.)<\/p>", "widget": null}, {"title": "Study 2: daylight vs. artificial light (2026)", "part": "", "html": "<h3>Study 2: daylight vs. artificial light (2026)<\/h3><p>A team led by Maastricht University in the Netherlands, with partners in Geneva and Germany, studied 13 older adults with type 2 diabetes. Each person spent 4.5 days in a room lit by daylight through big windows, and another 4.5 days in an identical room with artificial light, at least four weeks apart. Meals, sleep, and activity were kept the same. With daylight, people spent more time with blood sugar in the normal range. The video reports this as about 50% of the time versus 43%.<\/p>", "widget": null}, {"title": "Scientist check", "part": "Study 2: daylight vs. artificial light (2026)", "html": "<div class=\"check\">\n<h4>Scientist check<\/h4>\n<div class=\"claim\"><span class=\"tag t-early\">Early evidence<\/span><p>Both studies are real and interesting. But they're small (30 people and 13 people), short, and need to be repeated. The red light study used healthy people, not people with diabetes. The video's own description page says this is promising but not a diabetes treatment.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>Using the daylight study as proof of the red light idea. The Maastricht researchers mainly explain their results through the body clock: light-sensitive cells in the eye respond to daylight and help sync the body's rhythms. The daylight also came through windows, which the video elsewhere says block the helpful infrared. So the study supports \"daylight is good,\" but it doesn't show why.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-idea\">Idea stage<\/span><p>The office experiment with dimmed incandescent desk lamps. The video doesn't point to a published study, so we can't check how it was done.<\/p><\/div>\n<\/div>", "widget": null}, {"title": "Activity: design a better experiment", "part": "Study 2: daylight vs. artificial light (2026)", "html": "<div class=\"activity\"><h4>Activity: design a better experiment<\/h4><p>You get to run the next red light study. Write a one-page plan that answers: Who will you test? How many people? How long? What's your placebo? How will you make sure people don't know which group they're in? What result would prove the idea wrong? Then explain your plan out loud in two minutes, or record a voice memo, as if presenting it to a panel of scientists.<\/p><\/div>", "widget": null}, {"title": "Check your understanding", "part": "", "html": "<h3>Check your understanding<\/h3><details><summary>What is a placebo group and why did the 2024 study need one?<\/summary><div class=\"ans\"><p>A group that gets a fake version of the treatment (here, the light was off). It shows whether changes happened because of the real treatment, not just from sitting still or expecting a result.<\/p><\/div><\/details><details><summary>What's a \"crossover\" design, like in the Maastricht study?<\/summary><div class=\"ans\"><p>The same people try both conditions at different times. This helps because each person is compared with themselves.<\/p><\/div><\/details><details><summary>Give one reason to be careful before calling red light a diabetes treatment.<\/summary><div class=\"ans\"><p>Any of these: the study was small; it tested healthy people; it measured only one session; it hasn't been repeated widely.<\/p><\/div><\/details>", "widget": null}], "cards": [["Glucose", "The main sugar in your blood, and the main fuel mitochondria burn."], ["Insulin", "A hormone from the pancreas that works like a key, helping glucose get into cells."], ["Type 2 diabetes", "A condition where cells stop responding well to insulin, so blood sugar stays too high."], ["Glucose tolerance test", "A test where you drink a sugary drink and blood sugar is checked over about two hours."], ["Placebo", "A fake version of a treatment, used so researchers can tell whether the real treatment made the difference."], ["Crossover design", "A study where the same people try both conditions at different times, so each person is compared with themselves."]], "quiz": [{"t": "mc", "q": "What does insulin do?", "o": ["Makes red blood cells", "Helps glucose get into cells", "Breaks down fat in the stomach", "Absorbs red light"], "a": 1, "e": "Insulin works like a key that lets glucose from the blood enter cells."}, {"t": "mc", "q": "What wavelength of red light was used in the 2024 blood sugar study?", "o": ["450 nm", "530 nm", "670 nm", "1500 nm"], "a": 2, "e": "Participants received 670 nm red light on their upper backs."}, {"t": "mc", "q": "How many people took part in the 2024 red light study?", "o": ["13", "30", "741", "87,577"], "a": 1, "e": "There were 30 healthy adults, split into a light group and a placebo group. 13 was the Maastricht study."}, {"t": "mc", "q": "By how much did red light reduce the total rise in blood sugar over two hours?", "o": ["7.5%", "16%", "50%", "27.7%"], "a": 3, "e": "The total rise dropped by 27.7%. The peak spike dropped by 7.5%."}, {"t": "mc", "q": "What kind of design did the Maastricht daylight study use?", "o": ["Crossover: the same people tried both lighting conditions", "One group got daylight and never tried artificial light", "Tests on mice", "An online survey"], "a": 0, "e": "Each person spent 4.5 days in daylight and 4.5 days in artificial light, so they were compared with themselves."}, {"t": "mc", "q": "How do the Maastricht researchers mainly explain their results?", "o": ["Infrared light warming water in cells", "More vitamin D", "The body clock, tuned by light-sensitive cells in the eye", "Sunscreen use"], "a": 2, "e": "They point to daylight helping sync the body's rhythms through the eyes."}, {"t": "tf", "q": "The 2024 red light study tested people with type 2 diabetes.", "o": ["True", "False"], "a": 1, "e": "It tested healthy adults. Effects in people with diabetes still need to be studied."}, {"t": "tf", "q": "In the 2024 study, the placebo group sat the same way with the light switched off.", "o": ["True", "False"], "a": 0, "e": "This helps show that the result came from the light itself."}, {"t": "tf", "q": "In the Maastricht study, meals, sleep, and activity were kept the same in both conditions.", "o": ["True", "False"], "a": 0, "e": "Keeping these the same means the lighting was the main difference."}, {"t": "tf", "q": "The video cites a published study for the office experiment with incandescent desk lamps.", "o": ["True", "False"], "a": 1, "e": "No published source was given, so it can't be checked."}, {"t": "tf", "q": "Red light has been proven to be a treatment for diabetes.", "o": ["True", "False"], "a": 1, "e": "The evidence is early and small. The video's own description says it isn't a diabetes treatment."}, {"t": "sa", "q": "Explain how slower mitochondria could lead to higher blood sugar.", "s": "If mitochondria burn glucose more slowly, cells take in less, so glucose builds up in the blood, like cars in a traffic jam.", "e": "Look for the chain: slower burning, less glucose taken up, more left in the blood."}, {"t": "sa", "q": "What is a glucose tolerance test?", "s": "A test where a person drinks a sugary drink and their blood sugar is measured over about two hours to see how well the body handles it.", "e": "Full credit for the drink plus repeated blood sugar checks."}, {"t": "sa", "q": "Give two limitations of the blood sugar studies in this lesson.", "s": "Small numbers of people; short time periods (also accept: healthy participants only, not yet repeated, one session).", "e": "Any two valid limitations."}, {"t": "sa", "q": "Why does the Maastricht study's use of window daylight complicate the video's argument?", "s": "The video says windows block the helpful infrared, yet daylight through windows still improved blood sugar, which suggests another explanation, like the body clock.", "e": "Look for the contradiction between 'windows block infrared' and the positive result."}]}, {"id": "l5", "num": 5, "title": "Light, the brain, and a hospital on the roof", "intro": "<p class=\"lesson-num\">Lesson 5<\/p><h2>Light, the brain, and a hospital on the roof<\/h2><p class=\"meta\">Video chapters 18:11 to 23:58<\/p><div class=\"eli\"><strong>Explain it like I'm 10:<\/strong> Your brain is small but very hungry for energy. The video says that as people get older, their cell power plants get weaker, and that daylight might help protect the brain. Big studies show people who get more daylight tend to have healthier brains, but that doesn't yet prove daylight is the reason.<\/div>", "screens": [{"title": "The big ideas", "part": "", "html": "<h3>The big ideas<\/h3><p><strong>The brain is an energy hog.<\/strong> It's about 2% of your body weight but uses around 20% of your energy. When brain cells don't get enough energy, they struggle, and the brain's immune cells (microglia) can become inflamed.<\/p><p><strong>Animal studies on Parkinson's disease.<\/strong> Neuroscientist John Mitrofanis has studied near-infrared light in animals with a Parkinson's-like condition and found it helped protect the brain cells that the disease usually destroys. He has suggested red light therapy may partly be fixing problems caused by living indoors.<\/p><p><strong>Daylight and dementia (2026).<\/strong> A study published in <em>General Psychiatry<\/em> used data from 87,577 adults in the UK Biobank who wore wrist sensors that measured light for a week. Over about 8 years, 741 developed dementia. People whose average daytime light was above 1,000 lux (about as bright as a cloudy day outside) had about 16% lower risk.<\/p><p><strong>Sunlight and living longer.<\/strong> Dermatologist Richard Weller and colleagues analysed UK Biobank data from several hundred thousand people. Those with more sun exposure had lower death rates overall, including from heart disease and internal cancers.<\/p><p><strong>The rooftop ICU.<\/strong> In May 2026, King's College Hospital in London opened the UK's first outdoor critical care roof garden, with space for six beds where very sick patients can stay on full life support in fresh air and sunlight.<\/p><dl class=\"vocab\">\n<dt>Dementia<\/dt><dd>A group of brain conditions that damage memory and thinking. Alzheimer's is the most common.<\/dd>\n<dt>Preclinical<\/dt><dd>Research done in cells or animals, before testing in people.<\/dd>\n<dt>Correlation<\/dt><dd>Two things happening together. It doesn't prove one causes the other.<\/dd>\n<dt>Lux<\/dt><dd>A unit of brightness. Indoor rooms are often a few hundred lux; outdoors can be tens of thousands.<\/dd>\n<\/dl>", "widget": null}, {"title": "Scientist check", "part": "The big ideas", "html": "<div class=\"check\">\n<h4>Scientist check<\/h4>\n<div class=\"claim\"><span class=\"tag t-early\">Early evidence<\/span><p>Near-infrared light protecting brain cells in Parkinson's models. Encouraging, but animal results often don't carry over to humans.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-solid\">Solid<\/span><p>The dementia study found a real association in a large group. But it's a correlation: people who get more daylight may also be more active or healthier in other ways. It measured brightness, not red or infrared light specifically. The video also rounds the numbers (\"88,000 people in their 60s\"); the average age was 62.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>Linking Weller's work to red and infrared light. His UK Biobank studies focus on ultraviolet (UV) exposure, and they're also correlations.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>The hospital story. The roof garden is real. But the hospital's own announcement talks about nature, fresh air, sunlight, stress, and delirium. It doesn't credit a red-light survey, so the video's version of why it was built can't be confirmed.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-idea\">Idea stage<\/span><p>\"By age 60 to 70, ATP output drops 50 to 70%.\" No source is given in the video.<\/p><\/div>\n<\/div>", "widget": null}, {"title": "Activity: correlation or causation?", "part": "The big ideas", "html": "<div class=\"activity\">\n<h4>Activity: correlation or causation?<\/h4>\n<p>Here's a finding: \"People who spend more time outside have lower dementia risk.\" List at least three other explanations that could cause this pattern (for example, exercise). Then describe a study that could test whether daylight itself makes the difference.<\/p>\n<\/div>", "widget": null}, {"title": "Check your understanding", "part": "", "html": "<h3>Check your understanding<\/h3><details><summary>Why can't the dementia study prove that daylight prevents dementia?<\/summary><div class=\"ans\"><p>It observed people instead of randomly assigning light levels. Other differences, like exercise, social life, or overall health, might explain the link.<\/p><\/div><\/details><details><summary>What does \"preclinical\" mean, and why does it matter?<\/summary><div class=\"ans\"><p>Research in animals or cells. It's an important first step, but many treatments that work in animals don't work in people.<\/p><\/div><\/details><details><summary>What did King's College Hospital actually say the roof garden was for?<\/summary><div class=\"ans\"><p>To let critically ill patients benefit from nature, fresh air, and sunlight, and to research whether this reduces stress and improves wellbeing.<\/p><\/div><\/details>", "widget": null}], "cards": [["Dementia", "A group of brain conditions that damage memory and thinking. Alzheimer's is the most common."], ["Preclinical", "Research done in cells or animals, before testing in people."], ["Correlation", "Two things happening together. It doesn't prove one causes the other."], ["Lux", "A unit of brightness. Indoor rooms are often a few hundred lux; outdoors can be tens of thousands."]], "quiz": [{"t": "mc", "q": "About what share of body weight does the brain make up, and what share of energy does it use?", "o": ["2% of weight, 20% of energy", "20% of weight, 2% of energy", "10% of weight, 10% of energy", "50% of weight, 5% of energy"], "a": 0, "e": "The brain is small but very energy-hungry."}, {"t": "mc", "q": "What are microglia?", "o": ["Sugar molecules", "A type of light bulb", "The brain's immune cells", "Parts of the eye's lens"], "a": 2, "e": "Microglia defend the brain, but they can cause harm when they become chronically inflamed."}, {"t": "mc", "q": "In the dementia study, average daytime light above what level was linked to lower risk?", "o": ["10 lux", "100 lux", "1,000 lux", "50,000 lux"], "a": 2, "e": "1,000 lux is about as bright as a cloudy day outside."}, {"t": "mc", "q": "About how much lower was dementia risk for people above that light level?", "o": ["5%", "16%", "27.7%", "70%"], "a": 1, "e": "Risk was about 16% lower. 27.7% is from the red light blood sugar study."}, {"t": "mc", "q": "Richard Weller's UK Biobank studies mainly looked at exposure to:", "o": ["Near-infrared lamps", "LED panels", "Blue light from screens", "Ultraviolet (UV) light from the sun"], "a": 3, "e": "His work focuses on UV and sun exposure, not red or infrared light specifically."}, {"t": "mc", "q": "How many beds does the King's College Hospital roof garden hold?", "o": ["2", "6", "60", "600"], "a": 1, "e": "It holds up to six beds. The critical care unit below it has 60 beds."}, {"t": "tf", "q": "Preclinical research is done in animals or cells before testing in people.", "o": ["True", "False"], "a": 0, "e": "It's an important first step, but results don't always carry over to humans."}, {"t": "tf", "q": "The dementia study proves that daylight causes lower dementia risk.", "o": ["True", "False"], "a": 1, "e": "It found a correlation. Other factors, like exercise, could explain the link."}, {"t": "tf", "q": "The dementia study measured red and near-infrared light specifically.", "o": ["True", "False"], "a": 1, "e": "Wrist sensors measured overall brightness, not specific wavelengths."}, {"t": "tf", "q": "Mitrofanis tested near-infrared light in animal models of Parkinson's disease.", "o": ["True", "False"], "a": 0, "e": "The light helped protect the brain cells that Parkinson's normally destroys, in animals."}, {"t": "tf", "q": "The hospital's announcement credits a red light survey as the reason for building the roof garden.", "o": ["True", "False"], "a": 1, "e": "The announcement focuses on nature, fresh air, sunlight, stress, and delirium."}, {"t": "sa", "q": "Why is the brain especially vulnerable to an energy shortage?", "s": "It uses about 20% of the body's energy, and neurons need lots of ATP to send signals and keep their connections.", "e": "Full credit for high energy demand; bonus for linking to ATP or signalling."}, {"t": "sa", "q": "Give three other explanations for why people who spend more time outside might have lower dementia risk.", "s": "More exercise, more social contact, better overall health (also accept better sleep, less stress, higher income).", "e": "Any three reasonable alternative causes."}, {"t": "sa", "q": "What is the difference between correlation and causation? Give an example.", "s": "Correlation means two things happen together; causation means one actually makes the other happen. Example: ice cream sales and sunburns rise together because of hot weather, not because ice cream causes sunburn.", "e": "Look for a correct definition of both plus a sensible example."}, {"t": "sa", "q": "What did King's College Hospital say the roof garden was for?", "s": "To let critically ill patients benefit from nature, fresh air, and sunlight while on life support, and to research effects on stress and wellbeing.", "e": "Full credit for nature, fresh air, sunlight, or wellbeing."}]}, {"id": "l6", "num": 6, "title": "What you can actually do, and thinking for yourself", "intro": "<p class=\"lesson-num\">Lesson 6<\/p><h2>What you can actually do, and thinking for yourself<\/h2><p class=\"meta\">Video chapters 23:58 to the end<\/p><div class=\"eli\"><strong>Explain it like I'm 10:<\/strong> You don't need expensive gadgets. Go outside in the daytime, keep bright screens and harsh lights low at night, eat well, and move your body. These habits are good for you whether or not every claim in the video turns out to be true.<\/div>", "screens": [{"title": "The video's four steps", "part": "", "html": "<h3>The video's four steps<\/h3><ol class=\"steps\">\n<li><strong>A dimmed incandescent or halogen desk lamp.<\/strong> Instead of a costly red light panel, the video suggests a cheap old-style bulb on a dimmer, since these give off mostly infrared. <em>Safety note:<\/em> these bulbs get very hot. Never touch them, keep them away from curtains, paper, and bedding, and ask an adult before setting one up.<\/li>\n<li><strong>Daylight every day.<\/strong> Aim for 15 to 30 minutes outdoors, ideally in the morning and around midday. The video says to step outside rather than sit behind glass. <em>Safety note:<\/em> avoid sunburn. In strong sun, like midday in the tropics, use shade, a hat, and sunscreen. The video notes sunscreen blocks UV but not red and near-infrared.<\/li>\n<li><strong>Less blue light at night.<\/strong> Switch off bright white overhead lights in the evening, use warm lamps, and turn on night mode on screens. Bright light at night can reduce melatonin, the hormone that helps you sleep. This one matters a lot for teens, whose sleep is easily disrupted.<\/li>\n<li><strong>A healthy foundation.<\/strong> Eat nutrient-rich whole foods and stay active. The video also criticises seed oils. That specific claim is debated among nutrition scientists, so treat it with caution.<\/li>\n<\/ol>", "widget": null}, {"title": "Scientist check", "part": "The video's four steps", "html": "<div class=\"check\">\n<h4>Scientist check<\/h4>\n<div class=\"claim\"><span class=\"tag t-solid\">Solid<\/span><p>Getting daylight, protecting sleep from bright evening light, eating well, and exercising are all widely supported healthy habits.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-idea\">Idea stage<\/span><p>Using a dim incandescent lamp to improve metabolism. It's cheap and low-risk if used safely, but there's very little human evidence so far.<\/p><\/div>\n<div class=\"claim\"><span class=\"tag t-stretch\">Stretched<\/span><p>The ending says the \"cure\" needs no drugs or clinical approval. For people with diabetes or dementia, light is not a replacement for medical care.<\/p><\/div>\n<\/div>", "widget": null}, {"title": "Your claim detective toolkit", "part": "", "html": "<h3>Your claim detective toolkit<\/h3><p>Whenever you watch a health video, ask these questions:<\/p><ul>\n<li><strong>Who was studied?<\/strong> Cells, animals, healthy people, or patients?<\/li>\n<li><strong>How many?<\/strong> Thirteen people is a start; thousands is stronger.<\/li>\n<li><strong>What kind of study?<\/strong> An experiment with a control group, or an observation that can only show correlation?<\/li>\n<li><strong>Has it been checked?<\/strong> Peer-reviewed paper or preprint? Has anyone repeated it?<\/li>\n<li><strong>Do the words match the evidence?<\/strong> Watch for \"shocking,\" \"proven,\" \"undeniable,\" and \"cure.\"<\/li>\n<li><strong>Can I find the source?<\/strong> If a number has no study behind it, be careful.<\/li>\n<\/ul><p>Being a claim detective doesn't mean dismissing new ideas. Some of the most important discoveries started as bold hypotheses. It means holding each claim at the level its evidence supports.<\/p>", "widget": null}, {"title": "Final project: light audit and claim report", "part": "Your claim detective toolkit", "html": "<div class=\"activity\">\n<h4>Final project: light audit and claim report<\/h4>\n<ol>\n<li><strong>Light audit.<\/strong> For three days, log what bulbs are in the rooms you use, how many minutes you spend outdoors in daylight, and when you use screens at night.<\/li>\n<li><strong>Claim report.<\/strong> Choose one claim from the video. Find its original source in the reference list below. Write one page: what the video said, what the study actually found, and which label you'd give it (Solid, Early evidence, Idea stage, or Stretched) and why.<\/li>\n<li><strong>Share it.<\/strong> Make a short poster or 60-second video explaining your claim to a younger student, in \"explain like I'm 10\" style.<\/li>\n<\/ol>\n<\/div>", "widget": null}, {"title": "Final review", "part": "", "html": "<h3>Final review<\/h3><details><summary>Which of the four steps has the strongest evidence behind it?<\/summary><div class=\"ans\"><p>Getting daily outdoor daylight and reducing bright light at night have the broadest support, mainly through their effects on the body clock and sleep.<\/p><\/div><\/details><details><summary>A friend says, \"Red light cures diabetes, a study proved it.\" How would you respond?<\/summary><div class=\"ans\"><p>One small study of 30 healthy people found red light lowered the blood sugar rise after a sugary drink. That's interesting but early. It didn't test people with diabetes, and it isn't a cure or a replacement for treatment.<\/p><\/div><\/details><details><summary>Name one thing the video got right and one thing it overstated.<\/summary><div class=\"ans\"><p>Many answers work. Right: LEDs lack long wavelengths; daylight is linked to better health. Overstated: light as a food-like energy source; the rooftop hospital being a response to red light research.<\/p><\/div><\/details>", "widget": null}], "cards": [["Melatonin", "A hormone that rises in the dark and helps you sleep; bright evening light can hold it back."], ["Randomized controlled experiment", "A study that randomly assigns people to a treatment or a control group; the best way to show cause and effect."], ["Observational study", "A study that watches what people already do; it can show correlation but not prove cause."], ["Peer review", "Independent experts checking a study before it's published."], ["Sample size", "How many people or subjects were studied; bigger usually means more reliable."]], "quiz": [{"t": "mc", "q": "What does the video's Step 1 recommend?", "o": ["An expensive red light panel", "A blue LED strip", "A dimmed incandescent or halogen desk lamp", "A tanning bed"], "a": 2, "e": "The video says a cheap dimmed bulb gives off plenty of infrared, and many panels are overpowered."}, {"t": "mc", "q": "How much outdoor daylight does the video recommend each day?", "o": ["15 to 30 minutes", "1 to 2 minutes", "4 to 5 hours of sunbathing", "None; only at night"], "a": 0, "e": "Short, regular daylight exposure, ideally in the morning and around midday."}, {"t": "mc", "q": "Bright light at night can reduce which hormone that helps you sleep?", "o": ["Insulin", "Melatonin", "Adrenaline", "Growth hormone"], "a": 1, "e": "Melatonin rises in the dark. Bright evening light can hold it back."}, {"t": "mc", "q": "What is the main safety concern with incandescent and halogen bulbs?", "o": ["They are radioactive", "They are magnetic", "They get very hot and can cause burns or fires", "They make loud noises"], "a": 2, "e": "Keep them away from fabric and paper, and never touch a lit bulb."}, {"t": "mc", "q": "Which type of study is best for showing that something causes an effect?", "o": ["One person's testimonial", "An observational study", "A comment on a video", "A randomized controlled experiment"], "a": 3, "e": "Randomly assigning people to groups, with a control, helps rule out other explanations."}, {"t": "mc", "q": "According to the video, sunscreen blocks:", "o": ["Ultraviolet light, but not red and near-infrared", "All light", "Only red light", "No light at all"], "a": 0, "e": "Sunscreen filters UV, so it protects skin without blocking the long wavelengths."}, {"t": "tf", "q": "The claim that seed oils harm mitochondria is settled science.", "o": ["True", "False"], "a": 1, "e": "It's debated among nutrition scientists, so the course advises caution."}, {"t": "tf", "q": "Night mode on screens reduces blue light.", "o": ["True", "False"], "a": 0, "e": "It shifts the screen's colours warmer, removing much of the blue."}, {"t": "tf", "q": "Being a claim detective means rejecting all new scientific ideas.", "o": ["True", "False"], "a": 1, "e": "It means matching your confidence to the evidence. Many discoveries started as bold ideas."}, {"t": "tf", "q": "Light exposure can replace medical care for people with diabetes.", "o": ["True", "False"], "a": 1, "e": "Light is not a replacement for treatment. Anyone with a health condition should talk to a doctor."}, {"t": "tf", "q": "Words like \"shocking\" and \"undeniable\" are a signal to look at the evidence more carefully.", "o": ["True", "False"], "a": 0, "e": "Dramatic language can make weak evidence sound stronger than it is."}, {"t": "sa", "q": "List three questions a claim detective should ask about a health video.", "s": "Who was studied? How many people? Was it peer-reviewed? (Also accept: what kind of study, can I find the source, do the words match the evidence.)", "e": "Any three questions from the toolkit."}, {"t": "sa", "q": "Which of the four steps has the strongest evidence, and why?", "s": "Daily outdoor daylight and less bright light at night, because they're widely supported for body clock and sleep health.", "e": "Full credit for Step 2 or Step 3 with a reason."}, {"t": "sa", "q": "Rewrite this claim so it matches the evidence: \"Red light cures diabetes.\"", "s": "One small study found that red light lowered the blood sugar rise after a sugary drink in healthy adults. More research is needed, and it isn't a diabetes treatment.", "e": "Look for accurate scope: small, healthy people, early, not a cure."}, {"t": "sa", "q": "Why does Step 3 (less blue light at night) matter especially for teenagers?", "s": "Teens' sleep is easily disrupted, and bright evening light and screens can delay melatonin and make it harder to fall asleep.", "e": "Full credit for linking evening light to sleep or melatonin."}]}], "start": "<p>The video argues that modern LED lights and energy-saving windows have removed red and near-infrared light from our indoor lives, and that this may hurt our energy, blood sugar, and brain health. Some of this is backed by real studies. Some of it is a brand-new idea that scientists are still testing. And some of it is said more strongly than the evidence allows.<\/p><p>So this course does two jobs. It teaches the science in plain language, and it trains you to be a <strong>claim detective<\/strong>. In every lesson you'll see a \"Scientist check\" box that rates the video's claims with these labels:<\/p><div class=\"legend\">\n<span><span class=\"tag t-solid\">Solid<\/span> well established<\/span>\n<span><span class=\"tag t-early\">Early evidence<\/span> a few small studies<\/span>\n<span><span class=\"tag t-idea\">Idea stage<\/span> a hypothesis, not yet tested well<\/span>\n<span><span class=\"tag t-stretch\">Stretched<\/span> goes further than the evidence<\/span>\n<\/div><p class=\"note\">This course is for learning, not medical advice. Nobody should change a diabetes treatment or any medicine because of this video. Talk to a doctor first.<\/p><p class=\"meta\">Work at your own pace. Lesson 1 takes about two hours, so split it across a few sittings if you like. The other lessons take about 45 minutes each. Read each part, try the questions before checking answers, do the at-home labs, then take the lesson quiz.<\/p>", "refs": "<h2>References cited in the video<\/h2><p class=\"meta\">In the order they appear. The video doesn't give full citations, so each entry notes whether the original source could be found.<\/p><ol class=\"refs\">\n<li>Shah, N. K. (2026, September 14). <em>The light bulbs you need to get rid of immediately (new research)<\/em> [Video]. YouTube. <a href=\"https://youtu.be/5VRypR6NsoU\">youtu.be/5VRypR6NsoU<\/a>\n<span class=\"status\">The course source.<\/span><\/li>\n<li>Glen Jeffery, University College London, quoted saying about 95% of the light spectrum has been lost indoors.\n      <span class=\"status\">No written source given; likely from an interview. Related published work: Jeffery, G., Fosbury, R., Barrett, E., Hogg, C., Rodriguez Carmona, M., &amp; Powner, M. B. (2025). Longer wavelengths in sunlight pass through the human body and have a systemic impact which improves vision. <em>Scientific Reports, 15<\/em>, 24435.<\/span><\/li>\n<li>Scott Zimmerman, optics engineer, credited with the term \"ultra-processed light\" and the estimate that sunlight delivers two to three times more energy than food.\n      <span class=\"status\">No specific publication given. Zimmerman is a co-author of reference 5.<\/span><\/li>\n<li>Tiina Karu (spelled \"Tina\" in the video), USSR Academy of Sciences, research on red and near-infrared light and mitochondria from the 1980s.\n      <span class=\"status\">No specific paper named. A well-known example of her work: Karu, T. (1999). Primary and secondary mechanisms of action of visible to near-IR radiation on cells. <em>Journal of Photochemistry and Photobiology B: Biology, 49<\/em>(1), 1\u201317.<\/span><\/li>\n<li>Fosbury, R. A. E., Seheult, R., Zimmerman, S., &amp; Jeffery, G. (2026). <em>Metabolism in the solar photon field: A physical framework for photon-assisted modulation of mitochondrial electron-transfer kinetics<\/em> [Preprint]. bioRxiv. <a href=\"https://doi.org/10.64898/2026.08.11.744135\">doi.org/10.64898/2026.08.11.744135<\/a>\n<span class=\"status\">Found. Source of the 0.75 eV idea and the term \"photometabolism.\" Not yet peer-reviewed.<\/span><\/li>\n<li>Bob Fosbury and Glen Jeffery, \"21st century scurvy\" and light as an \"optical vitamin.\"\n      <span class=\"status\">Described in the video as their framing; no separate publication given.<\/span><\/li>\n<li>Powner, M. B., &amp; Jeffery, G. (2024). Light stimulation of mitochondria reduces blood glucose levels. <em>Journal of Biophotonics, 17<\/em>(5), e202300521. <a href=\"https://doi.org/10.1002/jbio.202300521\">doi.org/10.1002/jbio.202300521<\/a>\n<span class=\"status\">Found. The 670 nm red light and blood sugar trial.<\/span><\/li>\n<li>Jeffery's office experiment adding dimmed incandescent lamps to desks at University College London.\n      <span class=\"status\">No published source given.<\/span><\/li>\n<li>Harmsen, J.-F., et al. (2026). Natural daylight during office hours improves glucose control and whole-body substrate metabolism. <em>Cell Metabolism, 38<\/em>(1), 65\u201381. <a href=\"https://www.cell.com/cell-metabolism/fulltext/S1550-4131(25)00490-5\">cell.com/cell-metabolism<\/a>\n<span class=\"status\">Found. The Maastricht daylight study (called \"Mastri University\" in the video transcript).<\/span><\/li>\n<li>John Mitrofanis, studies of near-infrared light in preclinical Parkinson's disease models.\n      <span class=\"status\">No specific paper named in the video.<\/span><\/li>\n<li>Zheng, N., et al. (2026). Associations between wearable-device-measured daytime and nighttime light exposures and dementia risk: A prospective cohort study. <em>General Psychiatry<\/em>. <a href=\"https://pubmed.ncbi.nlm.nih.gov/42358626/\">PubMed<\/a>\n<span class=\"status\">Found. The 87,577-person UK Biobank study (rounded to \"88,000\" in the video).<\/span><\/li>\n<li>Richard Weller, University of Edinburgh, UK Biobank analysis of sunlight and mortality in \"more than 400,000 adults.\"\n      <span class=\"status\">The video doesn't say which paper. Two likely matches: Stevenson, A. C., Clemens, T., Pairo-Castineira, E., Webb, D. J., Weller, R. B., &amp; Dibben, C. (2024). Higher ultraviolet light exposure is associated with lower mortality: An analysis of data from the UK Biobank cohort study. <em>Health &amp; Place, 89<\/em>, 103328 (376,729 participants); and a 2026 medRxiv preprint, <em>Risk\u2013benefit balance of habitual ultraviolet exposure for cardiovascular, cancer, and skin cancer mortality: UK Biobank cohort study<\/em> (419,007 participants).<\/span><\/li>\n<li>Glen Jeffery's light survey of the critical care unit at King's College Hospital, London.\n      <span class=\"status\">No published source given.<\/span><\/li>\n<li>King's College Hospital NHS Foundation Trust. (2026, May 29). <em>Outdoor Critical Care Roof Garden opens at King's College Hospital<\/em>. <a href=\"https://www.kch.nhs.uk/news/outdoor-critical-care-roof-garden-opens-at-kings-college-hospital/\">kch.nhs.uk<\/a>\n<span class=\"status\">Found. The rooftop ICU ward.<\/span><\/li>\n<\/ol><h3>Additional sources used in Lesson 1, Part 11<\/h3><ol class=\"refs\">\n<li>Jeffery, G., Fosbury, R., Barrett, E., Hogg, C., Rodriguez Carmona, M., &amp; Powner, M. B. (2025). Longer wavelengths in sunlight pass through the human body and have a systemic impact which improves vision. <em>Scientific Reports, 15<\/em>, 24435. <a href=\"https://doi.org/10.1038/s41598-025-09785-3\">doi.org/10.1038/s41598-025-09785-3<\/a><\/li>\n<li>Jagdeo, J. R., Adams, L. E., Brody, N. I., &amp; Siegel, D. M. (2012). Transcranial red and near infrared light transmission in a cadaveric model. <em>PLoS ONE, 7<\/em>(10), e47460. <a href=\"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0047460\">journals.plos.org<\/a><\/li>\n<li>Tedford, C. E., DeLapp, S., Jacques, S., &amp; Anders, J. (2015). Quantitative analysis of transcranial and intraparenchymal light penetration in human cadaver brain tissue. <em>Lasers in Surgery and Medicine, 47<\/em>(4), 312\u2013322. <a href=\"https://pubmed.ncbi.nlm.nih.gov/25772014/\">PubMed<\/a><\/li>\n<li>Henderson, T. A., &amp; Morries, L. D. (2015). Near-infrared photonic energy penetration: Can infrared phototherapy effectively reach the human brain? <em>Neuropsychiatric Disease and Treatment, 11<\/em>. <a href=\"https://doi.org/10.2147/NDT.S78182\">doi.org/10.2147/NDT.S78182<\/a><\/li>\n<li>Radford, J., Gradauskas, V., Mitchell, K. J., Nerenberg, S., Starshynov, I., &amp; Faccio, D. (2025). Photon transport through the entire adult human head. <em>Neurophotonics, 12<\/em>(2), 025014. <a href=\"https://doi.org/10.1117/1.NPh.12.2.025014\">doi.org/10.1117/1.NPh.12.2.025014<\/a><\/li>\n<\/ol>", "hero": "<svg aria-label=\"Simplified sketch of three light sources. Sunlight covers visible light and extends far into near-infrared. LED light has a sharp blue spike and a green-yellow hump, then almost nothing past red. Incandescent bulbs give a little visible light and lots of near-infrared.\" role=\"img\" viewbox=\"0 0 720 300\">\n<defs>\n<lineargradient id=\"vis\" x1=\"0\" x2=\"1\">\n<stop offset=\"0\" stop-color=\"#6A2BB8\"><\/stop><stop offset=\".18\" stop-color=\"#2F55E0\"><\/stop>\n<stop offset=\".38\" stop-color=\"#1FA7A0\"><\/stop><stop offset=\".52\" stop-color=\"#4DB33A\"><\/stop>\n<stop offset=\".66\" stop-color=\"#E7D21F\"><\/stop><stop offset=\".8\" stop-color=\"#F08A1C\"><\/stop>\n<stop offset=\"1\" stop-color=\"#C81E1E\"><\/stop>\n<\/lineargradient>\n<lineargradient id=\"nir\" x1=\"0\" x2=\"1\">\n<stop offset=\"0\" stop-color=\"#8E1B1B\"><\/stop><stop offset=\"1\" stop-color=\"#8E1B1B\" stop-opacity=\"0\"><\/stop>\n<\/lineargradient>\n<\/defs>\n<line stroke=\"currentColor\" stroke-opacity=\".35\" x1=\"40\" x2=\"705\" y1=\"250\" y2=\"250\"><\/line>\n<rect fill=\"url(#vis)\" height=\"12\" rx=\"3\" width=\"227\" x=\"61\" y=\"258\"><\/rect>\n<rect fill=\"url(#nir)\" height=\"12\" rx=\"3\" width=\"412\" x=\"288\" y=\"258\"><\/rect>\n<g fill=\"currentColor\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<text fill-opacity=\".75\" x=\"120\" y=\"290\">visible light<\/text>\n<text fill-opacity=\".75\" x=\"400\" y=\"290\">near-infrared (you can't see it)<\/text>\n<text fill-opacity=\".6\" x=\"40\" y=\"24\">how much light<\/text>\n<text fill-opacity=\".6\" x=\"640\" y=\"243\">1500 nm<\/text>\n<text fill-opacity=\".6\" x=\"42\" y=\"243\">300<\/text>\n<\/g>\n<path d=\"M40,250 C80,222 110,72 150,62 C200,56 240,80 290,110 C360,150 450,182 560,215 C620,232 670,240 700,244\" fill=\"none\" stroke=\"#C9900A\" stroke-linecap=\"round\" stroke-width=\"4\"><\/path>\n<path d=\"M40,250 C150,246 250,190 330,132 C400,92 450,86 500,96 C580,116 650,150 700,170\" fill=\"none\" stroke=\"var(--red)\" stroke-dasharray=\"9 6\" stroke-linecap=\"round\" stroke-width=\"3\"><\/path>\n<path d=\"M40,250 L100,248 C112,245 118,60 124,55 C130,60 136,200 145,210 C160,216 175,132 195,126 C215,131 235,202 255,240 L275,249 L700,250\" fill=\"none\" stroke=\"var(--blue)\" stroke-linejoin=\"round\" stroke-width=\"3\"><\/path>\n<g font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"14\" font-weight=\"700\">\n<text fill=\"#B07C00\" x=\"160\" y=\"50\">Sunlight<\/text>\n<text fill=\"var(--red)\" x=\"505\" y=\"82\">Old-style incandescent bulb<\/text>\n<text fill=\"var(--blue)\" x=\"132\" y=\"104\">LED<\/text>\n<\/g>\n<\/svg>"};
const KEY = "lightcells-selfstudy-v1";
let S = {done:{}, quiz:{}, notes:{}, refl:{}, last:null};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const view = $("#view");

function flow(L){
  const f = [{kind:"intro", title:"Lesson overview"}];
  L.screens.forEach((s,i)=>f.push({kind:"screen", i, title:s.title}));
  f.push({kind:"cards", title:"Flashcards: key words"});
  f.push({kind:"quiz", title:"Lesson "+L.num+" quiz"});
  f.push({kind:"done", title:"Lesson "+L.num+" wrap-up"});
  return f;
}
const TOTAL = D.lessons.reduce((n,L)=>n+flow(L).length,0);
function key(L,i){ return L.id+":"+i; }
function lessonProgress(L){ const f=flow(L); const d=f.filter((_,i)=>S.done[key(L,i)]).length; return d/f.length; }
function overall(){ return Object.keys(S.done).length/TOTAL; }
function quizScore(L){
  const q=S.quiz[L.id]; if(!q) return null;
  let pts=0, answered=0;
  L.quiz.forEach((it,i)=>{
    if(it.t==="sa"){ const r=q.sa&&q.sa[i]; if(r!=null){answered++; pts+=r;} }
    else { const r=q.r&&q.r[i]; if(r){answered++; if(r.ok) pts++;} }
  });
  return {pts, answered, total:L.quiz.length};
}
function updateBar(){
  const p=Math.round(overall()*100);
  $("#meter span").style.width=p+"%"; $("#pct").textContent=p+"%";
}

let route = {view:"home"};
function go(r, focus=true){
  route=r;
  if(r.view==="lesson"){ S.last={l:r.l,s:r.s}; save(); }
  render();
  window.scrollTo(0,0);
  if(focus) view.focus({preventScroll:true});
}

function render(){
  updateBar();
  const pager=$("#pager"), back=$("#back"), next=$("#next"), where=$("#where");
  if(route.view==="lesson"){
    const L=D.lessons[route.l], f=flow(L), step=f[route.s];
    $("#bar-title").textContent="Lesson "+L.num+": "+L.title;
    pager.hidden=false;
    back.disabled=false;
    where.textContent="Lesson "+L.num+", screen "+(route.s+1)+" of "+f.length;
    next.textContent = route.s===f.length-1 ? (route.l<D.lessons.length-1 ? "Next lesson" : "Finish course") : "Next";
    renderStep(L,f,step);
  } else {
    $("#bar-title").textContent="Light, Cells & Health: self-study";
    pager.hidden = true;
    if(route.view==="home") renderHome();
    if(route.view==="glossary") renderGlossary();
    if(route.view==="refs") renderRefs();
    if(route.view==="start") renderStart();
  }
}

function dotsHTML(L,f){
  return '<div class="dots" aria-label="Screens in this lesson">'+f.map((s,i)=>
    `<button type="button" data-dot="${i}" class="${i===route.s?'here':(S.done[key(L,i)]?'done':'')}" title="${esc(s.title)}" aria-label="Screen ${i+1}: ${esc(s.title)}"></button>`).join("")+'</div>';
}

function renderStep(L,f,step){
  let h="";
  if(step.kind==="intro"){
    h=`<div class="screen">${L.intro}</div>
      <p class="meta">This lesson has ${f.length} screens, including flashcards, a 15-question quiz, and a wrap-up. Your progress saves automatically on this device.</p>`;
  } else if(step.kind==="screen"){
    const sc=L.screens[step.i];
    h=`<p class="crumb">${esc(sc.part||("Lesson "+L.num))}</p><h2 class="screen-title">${esc(sc.title)}</h2><div class="screen">${sc.html}</div>`;
    if(sc.widget==="wavelength") h+=wavelengthWidget();
    if(sc.widget==="depth") h+=depthWidget();
  } else if(step.kind==="cards"){
    h=`<p class="crumb">Lesson ${L.num}</p><h2 class="screen-title">Flashcards: key words</h2>
      <p>Say the definition out loud before you flip each card. Tap or press the card to flip it.</p>
      <div id="cards"></div>`;
  } else if(step.kind==="quiz"){
    h=`<p class="crumb">Lesson ${L.num}</p><h2 class="screen-title">Lesson ${L.num} quiz</h2>
      <p>15 questions. Multiple choice and true or false questions are marked as soon as you answer. For short answers, write your answer, compare it with the model answer, then mark yourself honestly.</p>
      <div id="quiz"></div>`;
  } else {
    h=`<p class="crumb">Lesson ${L.num}</p><h2 class="screen-title">Lesson ${L.num} wrap-up</h2><div id="wrap"></div>`;
  }
  h+=dotsHTML(L,f);
  if(step.kind!=="quiz" && step.kind!=="done"){
    const nk=L.id;
    h+=`<div class="notes-box"><label for="notes">My notes for Lesson ${L.num}</label><textarea id="notes" placeholder="Write anything you want to remember or ask about.">${esc(S.notes[nk]||"")}</textarea><div class="saved" id="saved" aria-live="polite"></div></div>`;
  }
  view.innerHTML=h;
  view.querySelectorAll("[data-dot]").forEach(b=>b.addEventListener("click",()=>go({view:"lesson",l:route.l,s:+b.dataset.dot})));
  const notes=$("#notes");
  if(notes){ let t; notes.addEventListener("input",()=>{ S.notes[L.id]=notes.value; clearTimeout(t); t=setTimeout(()=>{save(); $("#saved").textContent="Saved";},400); }); }
  if(step.kind==="screen"){ initWavelength(); initDepth(); }
  if(step.kind==="cards") initCards(L);
  if(step.kind==="quiz") initQuiz(L);
  if(step.kind==="done") initWrap(L);
}

/* ---------- home ---------- */
function renderHome(){
  const last=S.last;
  let cont = last ? `<button class="btn primary" id="continue" type="button">Continue: Lesson ${D.lessons[last.l].num}, screen ${last.s+1}</button>` :
    `<button class="btn primary" id="begin" type="button">Start with the introduction</button>`;
  view.innerHTML=`
  <div class="home-hero">
    <figure class="spectrum" style="margin-top:0">${D.hero}<figcaption class="caption">A simplified sketch: LEDs give off almost no light past red, while sunlight and old-style bulbs give off lots of invisible near-infrared.</figcaption></figure>
    <h1>Light, cells, and your health</h1>
    <p class="lede">A self-study course in six lessons. You'll learn how light works, how it interacts with your body, and how to judge the evidence behind bold health claims.</p>
  </div>
  <h2 style="font-size:1.4rem;margin:1.5rem 0 .4rem">How this works</h2>
  <ol class="how">
    <li>Work through each lesson one screen at a time. Use Next and Back at the bottom, or your arrow keys.</li>
    <li>When you see a question, answer it in your head or your notebook first, then tap to check.</li>
    <li>Do the at-home labs and activities. Keep a notebook for your results.</li>
    <li>Review the flashcards, then take the 15-question quiz. Your scores and notes save automatically on this device.</li>
  </ol>
  <div class="links">${cont}<button class="btn" id="intro" type="button">Read the introduction</button></div>
  <h2 style="font-size:1.4rem;margin:1.5rem 0 .4rem">Lessons</h2>
  <ul class="lesson-list">${D.lessons.map((L,i)=>{
    const p=lessonProgress(L), sc=quizScore(L);
    const sub = (p===0?"Not started":p>=1?"Complete":Math.round(p*100)+"% done") + (sc&&sc.answered===sc.total?`. Quiz: ${sc.pts} out of 15`:"");
    return `<li><button type="button" class="lesson-row ${p>=1?'complete':''}" data-l="${i}"><span class="num">${L.num}</span><span><span class="t">${esc(L.title)}</span><span class="s" style="display:block">${sub}</span></span><span class="meter" aria-hidden="true"><span style="width:${Math.round(p*100)}%"></span></span></button></li>`;
  }).join("")}</ul>
  <div class="links"><button class="btn quiet" id="gl" type="button">Glossary</button><button class="btn quiet" id="rf" type="button">References</button><button class="btn quiet" id="reset" type="button">Reset my progress</button></div>
  <p class="meta">This course is for learning, not medical advice.</p>`;
  const c=$("#continue"); if(c) c.onclick=()=>go({view:"lesson",l:last.l,s:last.s});
  const b=$("#begin"); if(b) b.onclick=()=>go({view:"start"});
  $("#intro").onclick=()=>go({view:"start"});
  view.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{
    const L=D.lessons[+x.dataset.l], f=flow(L); let s=f.findIndex((_,i)=>!S.done[key(L,i)]); if(s<0) s=0;
    go({view:"lesson",l:+x.dataset.l,s});
  });
  $("#gl").onclick=()=>go({view:"glossary"}); $("#rf").onclick=()=>go({view:"refs"});
  $("#reset").onclick=()=>{ if(confirm("Erase all progress, quiz answers, and notes on this device?")){ S={done:{},quiz:{},notes:{},refl:{},last:null}; save(); render(); } };
}
function backHome(){ return `<p><button class="btn quiet" type="button" id="home2">Back to lessons</button></p>`; }
function renderStart(){
  view.innerHTML=`<h2 class="screen-title">Introduction</h2><div class="screen">${D.start}</div>
  <div class="links"><button class="btn primary" type="button" id="go1">Start Lesson 1</button><button class="btn quiet" type="button" id="home2">Back to lessons</button></div>`;
  $("#go1").onclick=()=>go({view:"lesson",l:0,s:0}); $("#home2").onclick=()=>go({view:"home"});
}
function renderGlossary(){
  const all=[], seen=new Set(); D.lessons.forEach(L=>L.cards.forEach(c=>{const k=c[0].toLowerCase(); if(!seen.has(k)){seen.add(k); all.push([c[0],c[1],L.num]);}}));
  all.sort((a,b)=>a[0].localeCompare(b[0]));
  view.innerHTML=`<h2 class="screen-title">Glossary</h2>${backHome()}<dl class="gloss">${all.map(c=>`<dt>${esc(c[0])}</dt><dd>${esc(c[1])} <span style="color:var(--muted)">(Lesson ${c[2]})</span></dd>`).join("")}</dl>`;
  $("#home2").onclick=()=>go({view:"home"});
}
function renderRefs(){
  view.innerHTML=`${backHome()}<div class="screen">${D.refs}</div>`;
  $("#home2").onclick=()=>go({view:"home"});
}

/* ---------- widgets ---------- */
function wavelengthWidget(){
  return `<div class="widget" id="wl"><h4>Try it: wavelength explorer</h4>
  <p class="hint">Drag the slider to change the wavelength. Watch the color, the wave, and the energy of each photon change.</p>
  <label for="wlr" class="hint" style="display:block;margin:0">Wavelength: <b id="wlv">670</b> nm</label>
  <input type="range" id="wlr" min="250" max="1700" step="5" value="670">
  <div class="presets"><button data-w="300" type="button">UV-B 300</button><button data-w="450" type="button">Blue 450</button><button data-w="530" type="button">Green 530</button><button data-w="670" type="button">Red 670</button><button data-w="850" type="button">Near-infrared 850</button><button data-w="1650" type="button">0.75 eV</button></div>
  <div class="wl-grid"><div class="swatch" id="sw"></div>
  <div><dl class="stats"><dt>Type of light</dt><dd id="band"></dd><dt>Frequency</dt><dd id="freq"></dd><dt>Energy per photon</dt><dd id="ev"></dd></dl>
  <div class="ebar" aria-hidden="true"><span id="eb"></span></div></div></div>
  <svg class="wl-wave" viewBox="0 0 600 60" aria-hidden="true"><path id="wp" fill="none" stroke-width="3"/></svg>
  <p class="says" id="says"></p></div>`;
}
function rgbFor(w){
  let r=0,g=0,b=0;
  if(w>=380&&w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}
  else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else if(w<=750){r=1}
  let f=1; if(w<420)f=.3+.7*(w-380)/40; else if(w>700)f=.3+.7*(750-w)/50;
  return `rgb(${Math.round(255*r*f)},${Math.round(255*g*f)},${Math.round(255*b*f)})`;
}
function initWavelength(){
  const box=$("#wl"); if(!box) return;
  const r=$("#wlr",box);
  function upd(){
    const w=+r.value; $("#wlv",box).textContent=w;
    const ev=1240/w, fq=3e8/(w*1e-9)/1e14;
    let band, says, vis=w>=380&&w<=750;
    if(w<380){band="Ultraviolet (invisible)";says="Each photon has enough energy to break some chemical bonds, so UV can damage DNA and cause sunburn. Melanin in skin absorbs it near the surface.";}
    else if(w<600){band="Visible light";says="Your eyes see this. In skin, melanin and hemoglobin absorb these wavelengths strongly, so the light is soaked up near the surface.";}
    else if(w<=750){band="Visible red light";says="Red is at the start of the optical window. Hemoglobin absorbs much less of it, so it travels further into tissue than blue or green.";}
    else if(w<=1300){band="Near-infrared (invisible)";says="This is inside the optical window, where melanin, hemoglobin, and water all absorb relatively little. It travels furthest into the body, though it still fades quickly with depth.";}
    else {band="Near-infrared (invisible)";says="Past about 1,300 nm, water absorbs strongly, so this light is soaked up close to the surface and turns mostly into heat.";}
    if(Math.abs(w-1650)<=10) says+=" At about 1,650 nm, each photon has roughly 0.75 eV, the energy discussed in Lesson 3.";
    const sw=$("#sw",box);
    if(vis){sw.style.background=rgbFor(w);sw.style.color=w>560&&w<600?"#222":"#fff";sw.textContent="";}
    else{sw.style.background="repeating-linear-gradient(45deg,var(--bg) 0 8px,var(--rule) 8px 16px)";sw.style.color="var(--ink)";sw.textContent="You can't see this";}
    $("#band",box).textContent=band;
    $("#freq",box).textContent=fq.toFixed(1)+" × 10¹⁴ Hz";
    $("#ev",box).textContent=ev.toFixed(2)+" eV (1240 ÷ "+w+")";
    $("#eb",box).style.width=Math.min(100,ev/5*100)+"%";
    const lam=Math.max(14, w/1700*150); let d="M0,30";
    for(let x=0;x<=600;x+=3){ d+=` L${x},${(30-22*Math.sin(2*Math.PI*x/lam)).toFixed(1)}`; }
    const p=$("#wp",box); p.setAttribute("d",d); p.setAttribute("stroke", vis?rgbFor(w):"var(--muted)"); p.setAttribute("stroke-dasharray", vis?"":"6 4");
    $("#says",box).textContent=says;
  }
  r.addEventListener("input",upd);
  box.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{r.value=b.dataset.w;upd();});
  upd();
}
function depthWidget(){
  return `<div class="widget" id="dp"><h4>Try it: how fast does light fade?</h4>
  <p class="hint">Drag to go deeper into scalp, skull, and brain tissue. The numbers use the fading rate Tedford et al. measured for 808 nm light.</p>
  <label for="dpr" class="hint" style="display:block;margin:0">Depth: <b id="dpv">1.0</b> cm</label>
  <input type="range" id="dpr" min="0" max="5" step="0.1" value="1">
  <div class="tissue"><div class="beam" id="beam"></div><div class="marker" id="mk"></div></div>
  <div class="scale"><span>skin surface</span><span>2.5 cm</span><span>5 cm</span></div>
  <p class="big" id="dpp"></p><p class="says" id="dps"></p></div>`;
}
function initDepth(){
  const box=$("#dp"); if(!box) return; const r=$("#dpr",box);
  function upd(){
    const d=+r.value, pct=100*Math.exp(-2.22*d);
    $("#dpv",box).textContent=d.toFixed(1);
    $("#mk",box).style.left=(d/5*100)+"%";
    $("#beam",box).style.clipPath=`inset(0 ${100-d/5*100}% 0 0)`;
    const shown = pct>=10?pct.toFixed(0):pct>=1?pct.toFixed(1):pct>=0.01?pct.toFixed(2):pct.toFixed(4);
    $("#dpp",box).textContent=shown+"% of the light remains";
    const oneIn=Math.round(100/pct);
    $("#dps",box).textContent = d===0 ? "All of the light that enters is still there at the surface." :
      `That's about 1 photon in ${oneIn.toLocaleString()}. The rest has been absorbed or scattered along the way, mostly in the outer layers.`;
  }
  r.addEventListener("input",upd); upd();
}

/* ---------- flashcards ---------- */
function initCards(L){
  const box=$("#cards"); let order=L.cards.map((_,i)=>i), i=0, flipped=false;
  function draw(){
    const c=L.cards[order[i]];
    box.innerHTML=`<div class="card-stage"><button type="button" class="flash ${flipped?'flipped':''}" id="fc" aria-label="Flashcard. ${flipped?'Definition':'Term'} showing. Press to flip.">
      <span class="face front"><span class="term">${esc(c[0])}</span><small>Card ${i+1} of ${order.length}. Tap to flip.</small></span>
      <span class="face back"><span class="def">${esc(c[1])}</span><small>${esc(c[0])}</small></span></button></div>
      <div class="row"><button class="btn" type="button" id="pv" ${i===0?'disabled':''}>Previous card</button><button class="btn" type="button" id="nx" ${i===order.length-1?'disabled':''}>Next card</button><button class="btn quiet" type="button" id="sh">Shuffle</button></div>`;
    $("#fc").onclick=()=>{flipped=!flipped;draw();$("#fc").focus();};
    $("#pv").onclick=()=>{i--;flipped=false;draw();};
    $("#nx").onclick=()=>{i++;flipped=false;draw();};
    $("#sh").onclick=()=>{order.sort(()=>Math.random()-.5);i=0;flipped=false;draw();};
  }
  draw();
}

/* ---------- quiz ---------- */
function initQuiz(L){
  const box=$("#quiz"); S.quiz[L.id]=S.quiz[L.id]||{r:{},sa:{},txt:{}}; const Q=S.quiz[L.id];
  const kinds={mc:"Multiple choice",tf:"True or false",sa:"Short answer"};
  function scoreBox(){
    const s=quizScore(L);
    return `<div class="score" id="sc"><span class="n">${s.pts}</span><span>points out of 15<br><span style="color:var(--muted)">${s.answered} of 15 answered</span></span><button class="btn quiet" type="button" id="retake" style="margin-left:auto">Retake quiz</button></div>`;
  }
  function draw(){
    box.innerHTML=scoreBox()+L.quiz.map((it,i)=>{
      let body="";
      if(it.t!=="sa"){
        const r=Q.r[i];
        body=`<div class="opts2">${it.o.map((o,j)=>{
          let cls=""; if(r){ if(j===it.a) cls="ok"; else if(j===r.pick) cls="no"; }
          return `<button type="button" data-q="${i}" data-o="${j}" class="${cls}" ${r?'disabled':''}><span class="L">${it.t==="mc"?"ABCD"[j]:""}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
        if(r) body+=`<div class="verdict" aria-live="polite"><b>${r.ok?"Correct.":"Not quite. The answer is "+(it.t==="mc"?"ABCD"[it.a]+", ":"")+esc(it.o[it.a])+"."}</b>${esc(it.e)}</div>`;
      } else {
        const shown=Q.sa[i]!=null||Q.txt["show"+i];
        body=`<label class="k" for="t${i}">Your answer</label><textarea id="t${i}" data-t="${i}">${esc(Q.txt[i]||"")}</textarea>
          ${shown?`<div class="verdict"><b>Model answer</b>${esc(it.s)}<br><span style="color:var(--muted)">${esc(it.e)}</span></div>
          <div class="self"><span class="k">Mark yourself:</span>${[[1,"Got it"],[0.5,"Partly"],[0,"Not yet"]].map(([v,t])=>`<button type="button" class="btn quiet ${Q.sa[i]===v?'on':''}" data-sa="${i}" data-v="${v}">${t}</button>`).join("")}</div>`
          :`<div class="self"><button type="button" class="btn" data-show="${i}">Check my answer</button></div>`}`;
      }
      return `<div class="qcard"><div class="k">Question ${i+1}. ${kinds[it.t]}</div><p class="qt">${esc(it.q)}</p>${body}</div>`;
    }).join("");
    box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.o;Q.r[i]={pick:j,ok:j===L.quiz[i].a};save();keep(()=>draw(),b);});
    box.querySelectorAll("[data-t]").forEach(t=>t.oninput=()=>{Q.txt[t.dataset.t]=t.value;save();});
    box.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{Q.txt["show"+b.dataset.show]=true;save();keep(()=>draw(),b);});
    box.querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{Q.sa[b.dataset.sa]=+b.dataset.v;save();keep(()=>draw(),b);});
    $("#retake").onclick=()=>{ if(confirm("Clear your answers for this quiz?")){ S.quiz[L.id]={r:{},sa:{},txt:{}}; save(); initQuiz(L);} };
  }
  function keep(fn, el){ const y=el.closest(".qcard").getBoundingClientRect().top; const idx=[...box.querySelectorAll(".qcard")].indexOf(el.closest(".qcard")); fn(); const card=box.querySelectorAll(".qcard")[idx]; window.scrollBy(0, card.getBoundingClientRect().top-y); }
  draw();
}

/* ---------- wrap-up ---------- */
function initWrap(L){
  const s=quizScore(L)||{pts:0,answered:0,total:15};
  const R=S.refl[L.id]=S.refl[L.id]||{};
  const msg = s.answered<15 ? `You've answered ${s.answered} of 15 quiz questions. You can go back and finish the quiz any time.` :
    s.pts>=12 ? "Excellent work. You've got a strong grasp of this lesson." :
    s.pts>=8 ? "Good work. Revisit the screens for any questions you missed, then try the quiz again." :
    "This lesson is worth another look. Review the flashcards and the screens behind the questions you missed, then retake the quiz.";
  $("#wrap").innerHTML=`<div class="score"><span class="n">${s.pts}</span><span>quiz points out of 15</span></div><p>${msg}</p>
  <h3>3-2-1 reflection</h3><p>Writing down what you learned helps you remember it. Your answers save automatically.</p>
  ${[["three","3 things I learned"],["two","2 questions I still have"],["one","1 way this connects to my own life"]].map(([k,t])=>`<label class="k" style="display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;margin:1rem 0 .3rem" for="r_${k}">${t}</label><textarea id="r_${k}" data-r="${k}">${esc(R[k]||"")}</textarea>`).join("")}`;
  view.querySelectorAll("[data-r]").forEach(t=>t.oninput=()=>{R[t.dataset.r]=t.value;save();});
}

/* ---------- navigation ---------- */
function nextStep(){
  if(route.view!=="lesson") return;
  const L=D.lessons[route.l], f=flow(L);
  S.done[key(L,route.s)]=true; save();
  if(route.s<f.length-1) go({view:"lesson",l:route.l,s:route.s+1});
  else if(route.l<D.lessons.length-1) go({view:"lesson",l:route.l+1,s:0});
  else { S.last=null; save(); go({view:"home"}); }
}
function prevStep(){
  if(route.view!=="lesson") return;
  if(route.s>0) go({view:"lesson",l:route.l,s:route.s-1});
  else go({view:"home"});
}
$("#next").onclick=nextStep; $("#back").onclick=prevStep;
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.closest(".flash")) return;
  if(e.key==="ArrowRight") nextStep(); if(e.key==="ArrowLeft") prevStep();
  if(e.key==="Escape") closeDrawer();
});
$("#homebtn").onclick=()=>go({view:"home"});
function closeDrawer(){ const d=$("#drawer"); if(d){ d.remove(); $("#drawer-bg").remove(); $("#menu").focus(); } }
$("#menu").onclick=()=>{
  const bg=document.createElement("div"); bg.className="drawer-bg"; bg.id="drawer-bg"; bg.onclick=closeDrawer;
  const d=document.createElement("nav"); d.className="drawer"; d.id="drawer"; d.setAttribute("aria-label","Course contents");
  d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Contents</h2><button class="btn quiet" type="button" id="close">Close</button></div>
   <ol><li><a href="#" data-go="home">All lessons</a></li><li><a href="#" data-go="start">Introduction</a></li><li><a href="#" data-go="glossary">Glossary</a></li><li><a href="#" data-go="refs">References</a></li></ol>`+
   D.lessons.map((L,li)=>`<div class="lh">Lesson ${L.num}: ${esc(L.title)}</div><ol>${flow(L).map((s,si)=>`<li><a href="#" data-l="${li}" data-s="${si}" class="${S.done[key(L,si)]?'done':''}">${esc(s.title)}</a></li>`).join("")}</ol>`).join("");
  document.body.append(bg,d);
  $("#close").onclick=closeDrawer; $("#close").focus();
  d.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault(); closeDrawer();
    if(a.dataset.go) go({view:a.dataset.go}); else go({view:"lesson",l:+a.dataset.l,s:+a.dataset.s}); });
};
render();
</script>
</body></html>
